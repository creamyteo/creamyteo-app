databases:
  - name: creamyteo-db
    plan: basic-256mb
    databaseName: creamyteo
    user: creamyteo

services:
  - type: web
    name: creamyteo-app
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: creamyteo-db
          property: connectionString
      - key: SYNC_PASSWORD
        sync: false
