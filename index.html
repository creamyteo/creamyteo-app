<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creamy Teo App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#fbf6f0;--bg3:#f6ede4;
  --text:#2c2622;--text2:#6d6259;--text3:#a39a8f;
  --border:#f0e4d8;--border2:#e6d6c4;
  --accent:#ef7d5c;--accent2:#d8603f;
  --green:#3f9142;--green-bg:#e9f6e9;
  --red:#e0544a;--red-bg:#fdecea;
  --amber:#d99a2b;--amber-bg:#fdf3e0;
  --blue:#4a90c4;--blue-bg:#eaf4fb;
  --radius:14px;--radius-lg:20px;
  --sidebar:230px;
  --shadow:0 1px 3px rgba(60,40,20,.06),0 1px 2px rgba(60,40,20,.05);
  --shadow-md:0 6px 20px rgba(60,40,20,.08);
}
body{font-family:'Nunito','Segoe UI',system-ui,-apple-system,sans-serif;font-size:14px;background:var(--bg2);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:inherit}
/* LOGIN */
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#fff5ee 0%,#fdeee0 55%,#fbe6da 100%)}
.login-card{background:var(--bg);border:none;border-radius:24px;padding:2.75rem;width:370px;max-width:94vw;box-shadow:var(--shadow-md)}
.login-logo{text-align:center;margin-bottom:1.75rem}
.login-logo h1{font-size:24px;font-weight:800;color:var(--accent2);letter-spacing:-.3px}
.login-logo p{font-size:13px;color:var(--text3);margin-top:4px}
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:12px;color:var(--text2);margin-bottom:5px;font-weight:700}
.form-group select,.form-group input{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--radius);font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
.form-group select:focus,.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(239,125,92,.15)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border:1.5px solid var(--border2);border-radius:999px;background:var(--bg);color:var(--text);font-size:13px;font-weight:700;cursor:pointer;transition:transform .1s,background .15s,box-shadow .15s}
.btn:hover{background:var(--bg3);box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-bg)}
.btn-danger:hover{background:#fbdad6}
.btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-bg)}
.btn-success:hover{background:#d8f0d8}
.btn-full{width:100%;justify-content:center}
/* LAYOUT */
#app{display:none;height:100vh;overflow:hidden;flex-direction:row}
#sidebar{width:var(--sidebar);background:var(--bg);border-right:none;box-shadow:1px 0 0 var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{padding:20px 16px 14px}
.sidebar-logo h2{font-size:16px;font-weight:800;color:var(--accent2);letter-spacing:-.2px}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-user{margin:0 10px 10px;padding:10px 12px;background:var(--bg2);border-radius:var(--radius);display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-user-info p{font-size:12px;font-weight:700}
.sidebar-user-info span{font-size:11px;color:var(--text3)}
nav{flex:1;padding:4px 8px}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--text2);transition:background .12s,color .12s;border-left:none;border-radius:12px;position:relative;margin-bottom:2px}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;font-weight:700}
.nav-badge{position:absolute;right:10px;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;min-width:16px;text-align:center}
.nav-item .icon{font-size:15px;width:18px;text-align:center}
.sidebar-bottom{padding:12px;border-top:1px solid var(--border)}
#main{flex:1;overflow:auto;display:flex;flex-direction:column}
.topbar{background:var(--bg);border-bottom:1px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h2{font-size:17px;font-weight:800;letter-spacing:-.2px}
.topbar-actions{display:flex;gap:8px}
.page{padding:22px;display:none}
.page.active{display:block}
/* CARDS/GRIDS */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:22px}
.kpi-card{background:var(--bg);border-radius:var(--radius-lg);padding:16px;border:none;box-shadow:var(--shadow)}
.kpi-card .label{font-size:11px;color:var(--text3);margin-bottom:5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.kpi-card .value{font-size:21px;font-weight:800;color:var(--text)}
.kpi-card .sub{font-size:11px;color:var(--text3);margin-top:3px}
.card{background:var(--bg);border:none;border-radius:var(--radius-lg);padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{font-size:13px;font-weight:800;margin-bottom:12px;color:var(--text)}
/* TABLES */
.table-wrap{overflow-x:auto;border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:800;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg2);text-transform:uppercase;letter-spacing:.02em}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-gray{background:var(--bg3);color:var(--text2)}
/* TABS */
.tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:9px 16px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text3);border-bottom:2.5px solid transparent;margin-bottom:-1px;border-radius:8px 8px 0 0;transition:color .12s,background .12s}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.active{color:var(--accent2);border-bottom-color:var(--accent);background:var(--bg2)}
.tab-content{display:none}
.tab-content.active{display:block}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(44,38,34,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(1px)}
.modal{background:var(--bg);border-radius:24px;padding:26px;width:520px;max-width:96vw;max-height:88vh;overflow-y:auto;position:relative;box-shadow:0 20px 60px rgba(44,38,34,.25)}
.modal h3{font-size:17px;font-weight:800;margin-bottom:18px;letter-spacing:-.2px}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* ALERTS */
.alert{padding:11px 15px;border-radius:var(--radius);font-size:13px;margin-bottom:10px;display:flex;align-items:flex-start;gap:8px;border:none;font-weight:600}
.alert-red{background:var(--red-bg);color:var(--red)}
.alert-amber{background:var(--amber-bg);color:var(--amber)}
.alert-green{background:var(--green-bg);color:var(--green)}
.alert-blue{background:var(--blue-bg);color:var(--blue)}
/* PROGRESS */
.progress{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden}
.progress-bar{height:100%;border-radius:6px;transition:width .3s}
/* POS */
#pos-screen{display:none;height:100vh;flex-direction:column;background:var(--bg2)}
.pos-header{background:var(--bg);border-bottom:1px solid var(--border);padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
.pos-body{flex:1;display:grid;grid-template-columns:1fr 340px;overflow:hidden}
.pos-products{overflow-y:auto;padding:18px}
.pos-cart{background:var(--bg);border-left:1px solid var(--border);display:flex;flex-direction:column}
.pos-cart-header{padding:14px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:800}
.pos-cart-items{flex:1;overflow-y:auto;padding:8px}
.pos-cart-item{padding:10px;border-radius:var(--radius);margin-bottom:6px;background:var(--bg2);font-size:13px}
.pos-cart-footer{padding:14px 16px;border-top:1px solid var(--border)}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.product-card{background:var(--bg);border:none;border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:transform .12s,box-shadow .12s;text-align:center;box-shadow:var(--shadow)}
.product-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.product-emoji{font-size:28px;display:block;margin-bottom:6px}
.product-name{font-size:12px;font-weight:700;margin-bottom:4px}
.product-price{font-size:13px;color:var(--accent2);font-weight:800}
.cat-filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.cat-btn{padding:6px 14px;border:1.5px solid var(--border2);border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;background:var(--bg);color:var(--text2);transition:background .12s}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.qty-ctrl{display:flex;align-items:center;gap:8px}
.qty-ctrl button{width:26px;height:26px;border:1.5px solid var(--border2);border-radius:8px;background:var(--bg);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-weight:700}
.payment-btn{padding:7px 14px;border:1.5px solid var(--border2);border-radius:999px;cursor:pointer;font-size:12px;font-weight:700;background:var(--bg)}
.payment-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type=number],input[type=text],select,textarea{width:100%;padding:8px 11px;border:1.5px solid var(--border2);border-radius:var(--radius);font-size:13px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(239,125,92,.15)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
.section-header h3{font-size:15px;font-weight:800;letter-spacing:-.2px}
.star{color:#f2a93c}
.no-star{color:var(--border2)}
.pl-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid var(--border)}
.pl-row.bold{font-weight:700;border-bottom:none;padding-top:10px}
.pl-row.total{font-size:16px;font-weight:800;color:var(--accent2);border-top:2px solid var(--border2);padding-top:12px;margin-top:4px}
.scenario-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.scenario-card{background:var(--bg2);border:none;border-radius:var(--radius);padding:14px;text-align:center}
.scenario-card .s-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:700}
.scenario-card .s-value{font-size:16px;font-weight:800}
.inline-edit{background:transparent;border:none;border-bottom:1.5px dashed transparent;padding:2px 4px;width:80px;font-size:13px;border-radius:4px}
.inline-edit:hover,.inline-edit:focus{border-bottom-color:var(--accent);background:var(--blue-bg);outline:none}
.chip-green{background:var(--green-bg);color:var(--green);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip-amber{background:var(--amber-bg);color:var(--amber);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.chip-red{background:var(--red-bg);color:var(--red);padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
.ranking-item{display:flex;align-items:center;gap:12px;padding:11px;border-bottom:1px solid var(--border)}
.rank-num{width:26px;height:26px;background:var(--bg3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
/* ===== Additions (no overrides of base design) ===== */
.recipe-photo{width:100%;height:120px;object-fit:contain;background:var(--bg2);border-radius:var(--radius);margin-bottom:8px;display:block;border:none}
.product-photo{width:100%;height:80px;object-fit:contain;background:var(--bg2);border-radius:10px;margin-bottom:6px;display:block;border:none}
.photo-upload-preview{width:110px;height:110px;object-fit:contain;background:var(--bg2);border-radius:var(--radius);border:none}
.trend-up{color:var(--red);font-size:11px;font-weight:700}
.trend-down{color:var(--green);font-size:11px;font-weight:700}
.trend-flat{color:var(--text3);font-size:11px}
.link-btn{background:none;border:none;color:var(--accent2);font-size:12px;font-weight:700;cursor:pointer;text-decoration:underline;padding:0;display:block;margin:10px auto 0}
/* Tooltips (info icon) */
.kpi-card .label{display:flex;align-items:center;gap:4px}
.info-wrap{position:relative;display:inline-flex}
.info-icon{width:14px;height:14px;border-radius:50%;background:var(--border2);color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex-shrink:0}
.info-wrap .info-tip{display:none;position:absolute;left:0;top:22px;background:var(--text);color:#fff;font-size:11px;line-height:1.4;padding:9px 11px;border-radius:10px;width:220px;z-index:999;box-shadow:0 8px 20px rgba(0,0,0,.25);text-transform:none;font-weight:400;letter-spacing:normal}
.info-wrap:last-child .info-tip,.info-wrap.info-tip-right .info-tip{left:auto;right:0}
.info-wrap:hover .info-tip{display:block}
/* WhatsApp */
.btn-wa{background:var(--green-bg);color:var(--green);border-color:var(--green-bg)}
.btn-wa:hover{background:#d8f0d8}
/* Category groups POS */
.pos-cat-group{margin-bottom:20px}
.pos-cat-title{font-size:12px;font-weight:800;color:var(--text2);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.04em}
/* Recipe photo guidance */
.photo-hint{font-size:11px;color:var(--text3);margin-top:4px}
.role-gerente{background:var(--blue-bg);color:var(--blue)}
.role-administrativo{background:var(--amber-bg);color:var(--amber)}
.role-cajero{background:var(--green-bg);color:var(--green)}
.extras-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.extra-chip{border:1.5px solid var(--border2);border-radius:var(--radius);padding:9px 6px;font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:var(--bg);transition:all .12s;line-height:1.3}
.extra-chip:hover{border-color:var(--accent)}
.extra-chip.selected{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip-free{display:block;font-size:10px;font-weight:800;margin-top:3px;color:var(--green)}
.chip-price{display:block;font-size:10px;color:var(--text3);margin-top:3px}
.extra-chip.selected .chip-free,.extra-chip.selected .chip-price{color:#fff}
/* Resumen de categorías (carta) */
.cat-summary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.cat-summary-row:last-child{border-bottom:none}
.cat-summary-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:14px;border-top:2px solid var(--border2);font-size:16px;font-weight:800;color:var(--accent2)}
</style>
</head>
<body>

<div id="cloud-sync-indicator" onclick="promptSyncKey()" style="position:fixed;top:8px;right:10px;z-index:9999;font-size:11px;font-weight:700;background:#fff;padding:5px 10px;border-radius:999px;box-shadow:0 1px 3px rgba(60,40,20,.15);cursor:pointer;color:var(--text3)">âï¸ Sin sincronizar (toca para configurar)</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div style="font-size:36px;margin-bottom:6px">🍓</div>
      <h1>Creamy Teo App</h1>
      <p>Tu negocio, fácil de manejar</p>
    </div>
    <div class="form-group">
      <label>Perfil</label>
      <select id="login-role" onchange="filterLoginUsers()">
        <option value="gerente">Gerente (acceso total)</option>
        <option value="administrativo">Administrativo</option>
        <option value="cajero">Cajero / POS</option>
      </select>
    </div>
    <div class="form-group">
      <label>Usuario</label>
      <select id="login-user"></select>
    </div>
    <div class="form-group">
      <label>PIN</label>
      <input type="password" id="login-pin" placeholder="••••" maxlength="4" autocomplete="off">
    </div>
    <div id="login-err" style="font-size:12px;color:var(--red);margin-bottom:8px;display:none">PIN incorrecto</div>
    <button class="btn btn-primary btn-full" onclick="doLogin()">Ingresar al sistema</button>
    <button type="button" class="link-btn" onclick="openChangePinModal()">🔑 Cambiar mi PIN</button>
  </div>
</div>

<!-- POS SCREEN -->
<div id="pos-screen" style="display:none;height:100vh;flex-direction:column">
  <div class="pos-header">
    <div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:20px">🍓</span>
      <span style="font-weight:500">POS — <span id="pos-biz-name">Creamy Teo App</span></span>
      <span id="pos-cajero-badge" class="badge badge-blue"></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="text" id="pos-search" placeholder="Buscar producto..." style="width:200px" oninput="renderPOS()">
      <button class="btn btn-sm" onclick="goAdmin()" id="pos-admin-btn" style="display:none">Panel Admin</button>
      <button class="btn btn-sm btn-danger" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
  <div class="pos-body" style="display:grid;grid-template-columns:1fr 340px;flex:1;overflow:hidden">
    <div class="pos-products">
      <div class="cat-filter" id="pos-cats"></div>
      <div class="product-grid" id="pos-grid"></div>
    </div>
    <div class="pos-cart">
      <div class="pos-cart-header">🛒 Carrito <span id="cart-count" style="font-size:12px;color:var(--text3)"></span></div>
      <div class="pos-cart-items" id="cart-items"></div>
      <div class="pos-cart-footer">
        <div style="font-size:12px;color:var(--text2);margin-bottom:8px">Método de pago</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px" id="payment-methods"></div>
        <div class="pl-row"><span>Subtotal</span><span id="cart-sub">$0</span></div>
        <div class="pl-row"><span style="color:var(--text3)">Costo est.</span><span id="cart-cost" style="color:var(--text3)">$0</span></div>
        <div class="pl-row bold"><span>Margen</span><span id="cart-margin">-</span></div>
        <div style="display:flex;gap:6px;margin-top:10px">
          <button class="btn btn-danger" onclick="clearCart()" style="flex:1">🗑 Limpiar</button>
          <button class="btn btn-primary" onclick="cobrar()" style="flex:2">💰 Cobrar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="app" style="display:flex">
  <div id="sidebar">
    <div class="sidebar-logo">
      <h2>🍓 Creamy Teo App</h2>
      <p id="biz-name-sidebar">ERP v5.2</p>
    </div>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">A</div>
      <div class="sidebar-user-info">
        <p id="user-name-badge">Admin</p>
        <span id="user-role-badge">Administrador</span>
      </div>
    </div>
    <nav id="nav-menu"></nav>
    <div class="sidebar-bottom">
      <button class="btn btn-sm" style="width:100%;justify-content:center" onclick="logout()">Cerrar sesión</button>
    </div>
  </div>
  <div id="main">
    <div class="topbar">
      <h2 id="page-title">Dashboard</h2>
      <div class="topbar-actions">
        <button class="btn btn-sm" onclick="recalcAll()" title="Recalcular todo">🔄 Recalcular</button>
        <button class="btn btn-sm btn-primary" onclick="saveData()" title="Guardar">💾 Guardar</button>
      </div>
    </div>
    <div id="pages-container" style="padding:0;flex:1;overflow:auto">
      <!-- pages injected here -->
    </div>
  </div>

// UTILS
// ============================================================
function round2(n){return Math.round((n+Number.EPSILON)*100)/100}
function num2(n){return round2(n).toLocaleString('es-CO',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmt(n){return S.biz.currency+num2(n)}
function pct(n){return Math.round(n*10)/10+'%'}
// ----- Fecha + hora: usadas en ventas, compras y producción para saber exactamente cuándo pasó cada cosa -----
function pad2(n){return (n<10?'0':'')+n;}
function nowStamp(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate())+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function dateOnly(stamp){return (stamp||'').slice(0,10);}
// ============================================================
// ANÁLISIS POR PERIODO (semana / mes / año) — reutilizable para Compras y Ventas
// ============================================================
function startOfWeek(dateStr){
  var d=new Date(dateOnly(dateStr)+'T00:00:00');
  var day=(d.getDay()+6)%7; // 0=lunes
  d.setDate(d.getDate()-day);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function addDaysStr(dateStr,days){
  var d=new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function monthKeyOf(dateStr){ return dateOnly(dateStr).slice(0,7); }
function yearKeyOf(dateStr){ return dateOnly(dateStr).slice(0,4); }
var MONTHS_SHORT=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function shortDateLabel(dateStr){ var p=dateStr.split('-'); return parseInt(p[2])+' '+MONTHS_SHORT[parseInt(p[1])-1]; }
function monthLabelOf(key){ var p=key.split('-'); return MONTHS_SHORT[parseInt(p[1])-1]+' '+p[0].slice(2); }
function periodKeyOf(dateStr,granularity){
  return granularity==='week'?startOfWeek(dateStr):granularity==='month'?monthKeyOf(dateStr):yearKeyOf(dateStr);
}
// Serie de las últimas `n` semanas/meses/años (incluye el periodo actual), con valor 0 donde no hay datos
function buildPeriodSeries(records,dateFn,valueFn,granularity,n){
  var keys=[];
  if(granularity==='week'){
    var cur=startOfWeek(todayStr());
    for(var i=n-1;i>=0;i--){ keys.push(addDaysStr(cur,-7*i)); }
  } else if(granularity==='month'){
    var d=new Date(todayStr()+'T00:00:00');
    for(var j=n-1;j>=0;j--){ var dd=new Date(d.getFullYear(),d.getMonth()-j,1); keys.push(dd.getFullYear()+'-'+pad2(dd.getMonth()+1)); }
  } else {
    var y=parseInt(todayStr().slice(0,4));
    for(var k=n-1;k>=0;k--){ keys.push(String(y-k)); }
  }
  var map={};
  records.forEach(function(r){
    var key=periodKeyOf(dateFn(r),granularity);
    map[key]=(map[key]||0)+valueFn(r);
  });
  return keys.map(function(key){
    var label=granularity==='week'?shortDateLabel(key):granularity==='month'?monthLabelOf(key):key;
    return {key:key,label:label,value:map[key]||0};
  });
}
// Total del periodo actual vs. el periodo inmediatamente anterior (para la variación %)
function periodTotalVsPrevious(records,dateFn,valueFn,granularity){
  var curKey=periodKeyOf(todayStr(),granularity);
  var prevKey;
  if(granularity==='week') prevKey=addDaysStr(curKey,-7);
  else if(granularity==='month'){ var d=new Date(curKey+'-01T00:00:00'); d.setMonth(d.getMonth()-1); prevKey=d.getFullYear()+'-'+pad2(d.getMonth()+1); }
  else prevKey=String(parseInt(curKey)-1);
  var cur=0,prev=0,curCount=0;
  records.forEach(function(r){
    var key=periodKeyOf(dateFn(r),granularity);
    if(key===curKey){ cur+=valueFn(r); curCount++; }
    else if(key===prevKey) prev+=valueFn(r);
  });
  var changePct = prev>0 ? ((cur-prev)/prev*100) : (cur>0?100:0);
  return {current:cur,previous:prev,changePct:changePct,count:curCount};
}
function periodChangeBadgeHtml(p,goodIsUp){
  if(p.previous===0 && p.current===0) return '';
  var up=p.current>=p.previous;
  var cls;
  if(goodIsUp===null){ cls='badge-blue'; }
  else{
    var good = (goodIsUp===undefined?true:goodIsUp) ? up : !up;
    cls = good?'badge-green':'badge-red';
  }
  var arrow = up?'▲':'▼';
  return ' <span class="badge '+cls+'" style="vertical-align:middle">'+arrow+' '+Math.abs(Math.round(p.changePct))+'%</span>';
}
function periodBarChartHtml(series){
  var max=Math.max.apply(null, series.map(function(s){return s.value;}).concat([1]));
  var bars=series.map(function(s){
    var h=s.value>0?Math.max(3,Math.round((s.value/max)*100)):0;
    return '<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:34px">'+
      '<div style="font-size:10px;color:var(--text3);margin-bottom:3px;white-space:nowrap">'+(s.value>0?fmt(s.value):'')+'</div>'+
      '<div style="width:100%;max-width:34px;height:90px;display:flex;align-items:flex-end;background:var(--bg2);border-radius:4px 4px 0 0">'+
        '<div style="width:100%;height:'+h+'%;background:var(--accent);border-radius:4px 4px 0 0;transition:height .2s"></div>'+
      '</div>'+
      '<div style="font-size:10px;color:var(--text3);margin-top:5px;white-space:nowrap">'+s.label+'</div>'+
    '</div>';
  }).join('');
  return '<div style="display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding:4px 2px 0">'+bars+'</div>';
}
// Arma el bloque completo de análisis (KPIs semana/mes/año + 3 mini gráficas) para un set de registros dado
function renderPeriodAnalysisHtml(records,dateFn,valueFn,opts){
  opts=opts||{};
  var goodIsUp = opts.goodIsUp===undefined?true:opts.goodIsUp;
  var week=periodTotalVsPrevious(records,dateFn,valueFn,'week');
  var month=periodTotalVsPrevious(records,dateFn,valueFn,'month');
  var year=periodTotalVsPrevious(records,dateFn,valueFn,'year');
  var html='<div class="kpi-grid">'+
    '<div class="kpi-card"><div class="label">Esta semana'+infoIcon('Suma desde el lunes de esta semana hasta hoy, comparada con la semana anterior completa.')+'</div><div class="value">'+fmt(week.current)+periodChangeBadgeHtml(week,goodIsUp)+'</div><div class="sub">Semana anterior: '+fmt(week.previous)+'</div></div>'+
    '<div class="kpi-card"><div class="label">Este mes'+infoIcon('Suma desde el día 1 de este mes hasta hoy, comparada con el mes anterior completo.')+'</div><div class="value">'+fmt(month.current)+periodChangeBadgeHtml(month,goodIsUp)+'</div><div class="sub">Mes anterior: '+fmt(month.previous)+'</div></div>'+
    '<div class="kpi-card"><div class="label">Este año'+infoIcon('Suma desde el 1 de enero de este año hasta hoy, comparada con el año anterior completo.')+'</div><div class="value">'+fmt(year.current)+periodChangeBadgeHtml(year,goodIsUp)+'</div><div class="sub">Año anterior: '+fmt(year.previous)+'</div></div>'+
  '</div>';
  html+='<div class="card"><div class="card-title">Últimas 8 semanas</div>'+periodBarChartHtml(buildPeriodSeries(records,dateFn,valueFn,'week',8))+'</div>';
  html+='<div class="card"><div class="card-title">Últimos 6 meses</div>'+periodBarChartHtml(buildPeriodSeries(records,dateFn,valueFn,'month',6))+'</div>';
  html+='<div class="card"><div class="card-title">Últimos 5 años</div>'+periodBarChartHtml(buildPeriodSeries(records,dateFn,valueFn,'year',5))+'</div>';
  return html;
}
// Muestra "AAAA-MM-DD · HH:MM" en las tablas; si el registro es viejo y solo tiene fecha, se ve igual que antes.
function fmtDateTime(stamp){
  if(!stamp) return '';
  var sp=stamp.indexOf(' ');
  return sp>-1 ? stamp.slice(0,sp)+' <span style="color:var(--text3)">· '+stamp.slice(sp+1)+'</span>' : stamp;
}
function uid(){return Date.now()+Math.floor(Math.random()*9999)}
function getIngById(id){return S.ingredients.find(i=>i.id==id)}
// Clasificación de insumos por categoría (texto libre) en vez de casillas manuales:
// basta con escribir la categoría correcta al crear/editar el insumo.
function normCat(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function ingIsDisposable(ing){ if(!ing) return false; var c=normCat(ing.category); return c.indexOf('desechable')>-1 || c==='empaques'; }
function ingIsDeliveryPackaging(ing){ if(!ing) return false; var c=normCat(ing.category); return c.indexOf('domicilio')>-1; }
function ingIsTopping(ing){
  if(!ing) return false;
  var c=normCat(ing.category);
  if(c.indexOf('topping')>-1) return true;
  return (S.toppings||[]).some(function(t){return t.ingredientId===ing.id;});
}
function getRecipeById(id){return S.recipes.find(r=>r.id==id)}
function getCategoryById(id){return S.categories.find(c=>c.id==id)}
function getTotalFixedCosts(){return S.fixedCosts.reduce((a,c)=>a+c.monthly,0)}

function getCostPerBase(ing){
  if(!ing) return 0;
  var factor = getConversionFactor(ing.buyUnit, ing.baseUnit);
  if(!factor||factor===0) return 0;
  return ing.buyPrice / (ing.buyQty * factor);
}

function getConversionFactor(from, toBase){
  var group = null;
  for(var k in S.conversionFormulas){
    if(S.conversionFormulas[k][from] !== undefined){group=k;break;}
  }
  if(!group) return 1;
  var fromFactor = S.conversionFormulas[group][from] || 1;
  return fromFactor;
}

// Costo de una sola línea de ingrediente (para mostrarlo en la ficha, no altera el cálculo general)
function computeRiCost(ri){
  if(ri.ref==='recipe'){
    var sub=getRecipeById(ri.id);
    if(!sub) return 0;
    return getRecipeCostPerPortion(sub)*(ri.qty||0); // costo por gramo de la subreceta × gramos usados
  }
  if(ri.ref!=='ing') return 0;
  var ing=getIngById(ri.id);
  if(!ing) return 0;
  var factor=getConversionFactor(ri.unit, ing.baseUnit);
  var realQty=ri.qty*factor*(1+(ri.wastePct||0)/100);
  return realQty*getCostPerBase(ing);
}
// Devuelve la cantidad efectiva de una línea de ingrediente/desechable/empaque para un tamaño dado.
// Si el tamaño tiene un valor propio guardado en el mapa "...BySize", ese manda; si no, se usa la cantidad general.
// Esto es lo que permite asignar gramajes y recetas distintas a cada tamaño de un mismo producto.
function getSizeOverrideQty(bySizeMap, sizeId, itemId, fallbackQty){
  if(sizeId!=null && bySizeMap && bySizeMap[sizeId] && bySizeMap[sizeId][itemId]!=null) return bySizeMap[sizeId][itemId];
  return fallbackQty;
}
// Peso total (en gramos) de una subreceta, calculado SIEMPRE a partir de sus propios ingredientes
// (suma de los g/ml de cada insumo + los gramos usados de cualquier sub-subreceta). No hay gramaje
// mínimo ni "rinde" manual: el peso es 100% derivado de lo que realmente se cargó en la lista de
// ingredientes, así que crece o baja automáticamente si se agregan/quitan/editan ingredientes.
function getSubrecipeWeight(recipe){
  var weight = 0;
  (recipe.ingredients||[]).forEach(function(ri){
    if(ri.ref==='ing'){
      var ing = getIngById(ri.id);
      if(!ing) return;
      if(ing.baseUnit==='g'||ing.baseUnit==='ml'){
        var factor = getConversionFactor(ri.unit, ing.baseUnit);
        var realQty = ri.qty * factor * (1 + (ri.wastePct||0)/100);
        weight += realQty;
      }
    } else if(ri.ref==='recipe'){
      weight += ri.qty||0; // gramos de la sub-subreceta usados en esta subreceta
    }
  });
  return weight;
}
function getRecipeCostPerPortion(recipe, sizeId, visited){
  visited = visited || {};
  if(visited[recipe.id]) return 0;
  visited[recipe.id] = true;
  var total = 0;
  (recipe.ingredients||[]).forEach(function(ri){
    if(ri.ref==='ing'){
      var ing = getIngById(ri.id);
      if(!ing) return;
      var cpb = getCostPerBase(ing);
      var factor = getConversionFactor(ri.unit, ing.baseUnit);
      var qty = getSizeOverrideQty(recipe.ingredientsBySize, sizeId, ri.id, ri.qty);
      var realQty = qty * factor * (1 + (ri.wastePct||0)/100);
      total += realQty * cpb;
    } else if(ri.ref==='recipe'){
      var sub = getRecipeById(ri.id);
      if(!sub) return;
      var subCost = getRecipeCostPerPortion(sub, null, Object.assign({},visited));
      total += subCost * ri.qty;
    }
  });
  // Subrecetas: el costo por gramo sale de dividir el costo total de ingredientes entre el peso
  // real de esos mismos ingredientes — no existe un "gramaje producido" que el usuario deba escribir.
  if(recipe.isSubrecipe){
    var w = getSubrecipeWeight(recipe);
    return w>0 ? total/w : 0;
  }
  return total / (recipe.yield||1);
}

function getEffectiveMargin(recipe){
  if(recipe.marginGoal!=null) return recipe.marginGoal;
  var cat = recipe.category;
  if(S.marginByCategory[cat]!=null) return S.marginByCategory[cat];
  return S.biz.marginGoal||35;
}

function getRecipeMarginPct(recipe){
  var cost = getRecipeCostPerPortion(recipe);
  if(!recipe.basePrice||recipe.basePrice===0) return 0;
  return (recipe.basePrice - cost)/recipe.basePrice*100;
}

// ----- Gramaje / costo por gramo (por tamaño, si se indica) -----
function getRecipeTotalWeight(recipe, sizeId){
  var total=0;
  (recipe.ingredients||[]).forEach(function(ri){
    if(ri.ref!=='ing') return;
    var ing=getIngById(ri.id);
    if(!ing) return;
    if(ing.baseUnit==='g'||ing.baseUnit==='ml'){
      var factor=getConversionFactor(ri.unit, ing.baseUnit);
      var qty=getSizeOverrideQty(recipe.ingredientsBySize, sizeId, ri.id, ri.qty);
      total += qty*factor;
    }
  });
  return total;
}

// ----- Tendencia de precio de insumo (para ver por qué sube el costo) -----
function getIngTrend(ing){
  var ps=S.purchases.filter(function(p){return p.ingId===ing.id}).sort(function(a,b){return a.date.localeCompare(b.date)});
  if(ps.length===0) return null;
  var last=ps[ps.length-1];
  var lastCpb=last.newCostPerBase||0;
  if(!lastCpb) return null;
  var curCpb=getCostPerBase(ing);
  return (curCpb-lastCpb)/lastCpb*100;
}
function trendBadge(diff){
  if(diff===null||diff===undefined) return '<span class="trend-flat">—</span>';
  if(diff>1) return '<span class="trend-up">▲ '+pct(diff)+'</span>';
  if(diff<-1) return '<span class="trend-down">▼ '+pct(Math.abs(diff))+'</span>';
  return '<span class="trend-flat">= estable</span>';
}

// ----- Asignación de costos fijos: promedio por unidades vendidas al mes -----
function getMonthlyUnitsSoldAvg(){
  if(S.roi.avgUnitsManual!=null && S.roi.avgUnitsManual>0) return S.roi.avgUnitsManual;
  if(S.sales.length===0) return S.roi.portionsPerMonth||1;
  var months={};
  S.sales.forEach(function(s){
    var m=s.date.slice(0,7);
    var units=s.items.reduce(function(a,i){return a+i.qty},0);
    months[m]=(months[m]||0)+units;
  });
  var keys=Object.keys(months);
  var total=keys.reduce(function(a,m){return a+months[m]},0);
  return keys.length>0?total/keys.length:(S.roi.portionsPerMonth||1);
}
function getFixedCostPerUnitAuto(){
  var avg=getMonthlyUnitsSoldAvg();
  var tot=getTotalFixedCosts();
  return avg>0?tot/avg:0;
}
function getRecipeFixedAssigned(recipe){
  var base;
  if(S.costAllocation.method==='manual'){
    base=getTotalFixedCosts()*(recipe.fixedCostPct||0)/100/30;
  } else {
    base=getFixedCostPerUnitAuto();
  }
  var factor=recipe.fixedFactor!=null?recipe.fixedFactor:1;
  return base*factor;
}

// ----- Empaques (vasos, tapas, etc): total vs solo obligatorios (los opcionales se deciden en el POS) -----
function getRecipePackagingCostAll(recipe, sizeId){
  return (recipe.packaging||[]).reduce(function(a,p){
    var pk=S.packagings.find(function(x){return x.id===p.id});
    var qty=getSizeOverrideQty(recipe.packagingBySize, sizeId, p.id, p.qty);
    return a+(pk?pk.cost*qty:0);
  },0);
}
function getRecipePackagingCostMandatory(recipe, sizeId){
  return (recipe.packaging||[]).reduce(function(a,p){
    var pk=S.packagings.find(function(x){return x.id===p.id});
    if(!pk||pk.optional) return a;
    var qty=getSizeOverrideQty(recipe.packagingBySize, sizeId, p.id, p.qty);
    return a+pk.cost*qty;
  },0);
}

// ----- Depreciación de equipos/activos (materiales x tiempo) asignada por unidad -----
function getEquipmentMonthlyTotal(){
  return S.equipment.filter(function(e){return e.active}).reduce(function(a,e){
    var life=e.usefulLifeMonths>0?e.usefulLifeMonths:36;
    return a+(e.cost/life);
  },0);
}
function getEquipmentCostPerUnit(){
  var avg=getMonthlyUnitsSoldAvg();
  var tot=getEquipmentMonthlyTotal();
  return avg>0?tot/avg:0;
}

// ----- Costo total real (financieramente completo) y margen real -----
function getRecipeFullMarginPct(recipe){
  if(!recipe.basePrice) return 0;
  var full=getRecipeFullCost(recipe);
  return (recipe.basePrice-full)/recipe.basePrice*100;
}

function getMonthSales(){
  var now = new Date();
  var monthStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
  return S.sales.filter(function(s){return s.date.startsWith(monthStr)});
}

function getMonthTotals(){
  var ms = S.sales; // use all for demo
  var rev = ms.reduce(function(a,s){return a+s.total},0);
  var cost = ms.reduce(function(a,s){return a+s.cost},0);
  var fixed = getTotalFixedCosts();
  var gross = rev - cost;
  var net = gross - fixed;
  return {revenue:rev,cost:cost,gross:gross,fixed:fixed,net:net};
}

function calcAlerts(){
  var alerts = [];
  S.ingredients.forEach(function(ing){
    if(ing.stock <= ing.minStock) alerts.push({type:'stock',msg:'Stock crítico: '+ing.name+' ('+ing.stock+'/'+ing.minStock+')',level:'red'});
  });
  S.recipes.forEach(function(r){
    // Las subrecetas (ej. "Crema de la casa") no se venden directo: no tienen precio de venta,
    // solo costo por gramo. No deben generar alertas de precio/margen/costo total.
    if(r.isSubrecipe) return;
    var cost = getRecipeCostPerPortion(r);
    if(r.basePrice < cost) alerts.push({type:'price',msg:'Precio bajo costo de materia prima: '+r.name,level:'red'});
    var fullCost=getRecipeFullCost(r);
    if(r.basePrice < fullCost) alerts.push({type:'fullcost',msg:'Precio bajo el costo total real (con fijos+impuestos): '+r.name,level:'amber'});
    var margin = getRecipeFullMarginPct(r);
    var effMargin = getEffectiveMargin(r);
    if(margin < effMargin) alerts.push({type:'margin',msg:'Margen real bajo objetivo en '+r.name+' ('+pct(margin)+' < '+pct(effMargin)+')',level:'amber'});
  });
  var t = getMonthTotals();
  if(t.net < 0) alerts.push({type:'net',msg:'Utilidad neta negativa este mes',level:'red'});
  if(t.revenue > 0 && t.net/t.revenue*100 < S.biz.marginGoal/2) alerts.push({type:'netmargin',msg:'Margen neto general por debajo de la mitad del objetivo',level:'amber'});
  S.alertsCount = alerts.length;
  updateAlertBadge();
  return alerts;
}

function updateAlertBadge(){
  var b = document.getElementById('alert-nav-badge');
  if(b) b.textContent = S.alertsCount > 0 ? S.alertsCount : '';
}

function recalcAll(){
  calcAlerts();
  if(S.currentPage) navigateTo(S.currentPage);
}

function saveData(){
  try{localStorage.setItem('creamyteo_erp',JSON.stringify(S));}catch(e){}
  showToast('💾 Guardado');
  syncToCloud();
}
function loadData(){
  try{
    // Migración: si el navegador todavía tiene datos guardados con la llave antigua ("fresas_erp",
    // de cuando la app no tenía nombre propio) y no hay nada con la llave nueva, los recuperamos
    // una sola vez para no perder la información del negocio.
    var d=localStorage.getItem('creamyteo_erp');
    if(!d){
      var legacy=localStorage.getItem('fresas_erp');
      if(legacy){ d=legacy; localStorage.setItem('creamyteo_erp',legacy); }
    }
    if(d){var parsed=JSON.parse(d);Object.assign(S,parsed);}
  }catch(e){}
}
setInterval(saveData, 120000);

// ============================================================
// SINCRONIZACIÓN EN LA NUBE (backend en Render + PostgreSQL)
// ============================================================
// El navegador sigue guardando en localStorage al instante (así la app
// funciona aunque se corte internet), y además manda una copia al servidor
// para que los datos se compartan entre dispositivos y no se pierdan.
var SYNC_KEY_STORAGE='creamyteo_sync_key';
var syncKey=localStorage.getItem(SYNC_KEY_STORAGE)||'';
var cloudSyncing=false;
var cloudSyncFailed=false;

function syncToCloud(){
  if(!syncKey||cloudSyncing) return;
  cloudSyncing=true;
  fetch('/api/state',{
    method:'PUT',
    headers:{'Content-Type':'application/json','x-sync-key':syncKey},
    body:JSON.stringify(S)
  }).then(function(r){
    cloudSyncing=false;
    cloudSyncFailed=!r.ok;
    updateSyncIndicator();
  }).catch(function(){
    cloudSyncing=false;
    cloudSyncFailed=true;
    updateSyncIndicator();
  });
}

function loadFromCloud(silent){
  if(!syncKey) return;
  fetch('/api/state',{headers:{'x-sync-key':syncKey}})
    .then(function(r){ if(!r.ok) throw new Error('auth'); return r.json(); })
    .then(function(res){
      if(res&&res.data){
        Object.assign(S,res.data);
        try{localStorage.setItem('creamyteo_erp',JSON.stringify(S));}catch(e){}
        filterLoginUsers();
        recalcAll();
      }
      cloudSyncFailed=false;
      updateSyncIndicator();
      if(!silent) showToast('☁️ Datos actualizados desde la nube');
    })
    .catch(function(){
      cloudSyncFailed=true;
      updateSyncIndicator();
    });
}

function updateSyncIndicator(){
  var el=document.getElementById('cloud-sync-indicator');
  if(!el) return;
  if(!syncKey){ el.textContent='☁️ Sin sincronizar (toca para configurar)'; el.style.color='var(--text3)'; return; }
  if(cloudSyncFailed){ el.textContent='⚠️ Sin conexión con la nube'; el.style.color='var(--red)'; return; }
  el.textContent='☁️ Sincronizado'; el.style.color='var(--green)';
}

function promptSyncKey(){
  var pw=prompt('Clave de sincronización en la nube\n(la que configuraste en Render, variable SYNC_PASSWORD):');
  if(pw){
    syncKey=pw;
    localStorage.setItem(SYNC_KEY_STORAGE,pw);
    loadFromCloud();
  }
}

function showToast(msg){
  var t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:#1a1a18;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;z-index:9999;opacity:1;transition:opacity .5s';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove()},500)},2000);
}

function switchTab(group, idx, el){
  window._activeTabs = window._activeTabs || {};
  window._activeTabs[group] = idx;
  var tabs=document.querySelectorAll('#'+group+'-tabs .tab');
  tabs.forEach(function(t){t.classList.remove('active')});
  el.classList.add('active');
  for(var i=0;i<10;i++){
    var tc=document.getElementById(group+'-tab'+i);
    if(tc) tc.classList.remove('active');
  }
  var active=document.getElementById(group+'-tab'+idx);
  if(active) active.classList.add('active');
}

function restoreActiveTabs(container){
  window._activeTabs = window._activeTabs || {};
  var tabGroups = container.querySelectorAll('.tabs[id$="-tabs"]');
  tabGroups.forEach(function(tg){
    var group = tg.id.replace('-tabs','');
    var idx = window._activeTabs[group] || 0;
    if(!idx) return;
    var tabs = tg.querySelectorAll('.tab');
    tabs.forEach(function(t,i){t.classList.toggle('active', i===idx)});
    for(var i=0;i<10;i++){
      var tc=document.getElementById(group+'-tab'+i);
      if(tc) tc.classList.toggle('active', i===idx);
    }
  });
}

function updateConvFactor(grp,unit,val){S.conversionFormulas[grp][unit]=parseFloat(val)||1;recalcAll();}
function updateIngStock(id,val){var i=getIngById(id);if(i)i.stock=parseFloat(val)||0;recalcAll();}
function updateIngMin(id,val){var i=getIngById(id);if(i)i.minStock=parseFloat(val)||0;recalcAll();}

  var msg='¿Eliminar el insumo "'+ing.name+'"?';
  if(linked.length) msg+='\n\nEstá vinculado a '+linked.length+' topping(s)/salsa(s). Quedarán sin insumo vinculado (sin costo real), pero no se eliminarán.';
  askConfirm(msg,function(){

function saveProductModal(id){
  var name=document.getElementById('pm-name').value.trim();
  if(!name){ showToast('Ponle un nombre al producto'); return; }
  var catVal=document.getElementById('pm-cat').value;
  var categoryId=catVal?parseInt(catVal):null;
  var f=id?S.productFolders.find(function(x){return x.id===id;}):null;
  if(f){ f.name=name; f.categoryId=categoryId; closeModal(); recalcAll(); }
  else {
    var newId=uid();
    S.productFolders.push({id:newId,name:name,categoryId:categoryId,active:true});
    closeModal();
    openProductDetailModal(newId);
  }
}
function deleteProductFolder(id){
  var f=S.productFolders.find(function(x){return x.id===id;});
  if(!f) return;
  var list=productPresentations(id);
  var msg='¿Eliminar el producto "'+f.name+'"?'+(list.length?'\n\nSus '+list.length+' presentación(es) también se eliminarán.':'');
  askConfirm(msg,function(){
    S.recipes=S.recipes.filter(function(r){return r.folderId!==id;});
    S.productFolders=S.productFolders.filter(function(x){return x.id!==id;});
    closeModal();
    recalcAll();
  },{title:'Eliminar producto'});
}
// Vista de detalle de un producto: tabla de presentaciones con receta, gramaje, costo y precio.
function openProductDetailModal(folderId){

  var list=productPresentations(folderId);

    var cost=getRecipeFullCost(r,null,false);

function getToppingsAvgPrice(){
  var act=S.toppings.filter(function(t){return t.active});
  if(act.length===0) return 0;
  return act.reduce(function(a,t){return a+t.price},0)/act.length;
}
function getSaucesAvgPrice(){
  var act=S.sauces.filter(function(s){return s.active&&!s.included});
  if(act.length===0) return 0;
  return act.reduce(function(a,s){return a+s.price},0)/act.length;
}

// ----- Costo real de toppings/salsas según insumo vinculado + gramaje configurado por producto/tamaño -----
// item.usage ahora es una lista plana: [{recipeId, sizeId (null = todos los tamaños), grams}]
function getExtraCostPerGram(item){
  if(!item.ingredientId) return 0;
  var ing=getIngById(item.ingredientId);
  if(!ing) return 0;
  return getCostPerBase(ing); // costo por g/ml del insumo
}
// Gramaje EXACTO configurado para un topping/salsa en una ficha+tamaño (0 si no está configurado = no se usa ahí).
function getExtraGramsForRecipe(item, recipeId, sizeId){
  var rows=item.usage||[];
  var exact=rows.find(function(u){return u.recipeId===recipeId && u.sizeId===sizeId;});
  if(exact) return exact.grams;
  var anySize=rows.find(function(u){return u.recipeId===recipeId && (u.sizeId===null||u.sizeId===undefined);});
  if(anySize) return anySize.grams;
  return 0; // no configurado para esta ficha = no se usa (no se cobra ni se descuenta)
}
function setUsageGrams(item, recipeId, sizeId, grams){
  item.usage=item.usage||[];
  var idx=item.usage.findIndex(function(u){return u.recipeId===recipeId && u.sizeId===sizeId;});
  if(!grams || grams<=0){
    if(idx>-1) item.usage.splice(idx,1);
    return;
  }
  if(idx>-1) item.usage[idx].grams=grams;
  else item.usage.push({recipeId:recipeId,sizeId:sizeId,grams:grams,price:0});
}
// Precio cobrado al cliente por este topping/salsa en un producto/presentación específico (0 = gratis/incluido).
function getExtraPriceForRecipe(item, recipeId, sizeId){
  var rows=item.usage||[];
  var exact=rows.find(function(u){return u.recipeId===recipeId && u.sizeId===sizeId;});
  return exact&&exact.price?exact.price:0;
}
function setUsagePrice(item, recipeId, sizeId, price){
  item.usage=item.usage||[];
  var idx=item.usage.findIndex(function(u){return u.recipeId===recipeId && u.sizeId===sizeId;});
  if(idx>-1) item.usage[idx].price=price||0;
  // si no existe la fila (gramos=0), no tiene sentido guardar precio sin gramaje
}
// Promedio general de gramaje configurado (para referencia/analítica, no para costeo determinista)
function getExtraAvgGrams(item){
  var rows=item.usage||[];
  if(rows.length===0) return 0;
  return rows.reduce(function(a,u){return a+u.grams},0)/rows.length;
}
function getExtraCostForRecipe(item, recipeId, sizeId){
  var grams=getExtraGramsForRecipe(item, recipeId, sizeId);
  return grams*getExtraCostPerGram(item);
}
function getExtraAvgCost(item){
  return getExtraAvgGrams(item)*getExtraCostPerGram(item);
}
// Costo ESTIMADO de los toppings/salsas incluidos gratis en una ficha (para el costeo de planeación en la ficha).
// Es un promedio entre los toppings configurados específicamente para esta ficha, ya que en el POS el cliente elige cuáles.
function getRecipeIncludedExtrasCost(recipe, sizeId){
  var total=0;
  var freeTop=getFreeToppingsCount(recipe, sizeId);
  if(freeTop>0){
    var costs=S.toppings.filter(function(t){return t.active && !t.premium;}).map(function(t){return getExtraCostForRecipe(t, recipe.id, sizeId);}).filter(function(c){return c>0;});
    if(costs.length>0){
      var avgTopCost=costs.reduce(function(a,c){return a+c;},0)/costs.length;
      total+=avgTopCost*freeTop;
    }
  }
  S.sauces.filter(function(s){return s.active&&s.included;}).forEach(function(s){
    total+=getExtraCostForRecipe(s, recipe.id, sizeId);
  });
  var freeExtraSauces=getFreeExtraSaucesCount(recipe, sizeId);
  if(freeExtraSauces>0){
    var scosts=S.sauces.filter(function(s){return s.active&&!s.included;}).map(function(s){return getExtraCostForRecipe(s, recipe.id, sizeId);}).filter(function(c){return c>0;});
    if(scosts.length>0){
      var avgSauceCost=scosts.reduce(function(a,c){return a+c;},0)/scosts.length;
      total+=avgSauceCost*freeExtraSauces;
    }
  }
  return total;
}
// Cantidad de toppings/salsas gratis, con posibilidad de variar según el tamaño elegido
function getFreeToppingsCount(recipe, sizeId){
  if(sizeId && recipe.toppingsIncludedBySize && recipe.toppingsIncludedBySize[sizeId]!=null) return recipe.toppingsIncludedBySize[sizeId];
  return recipe.toppingsIncluded||0;
}
function getFreeExtraSaucesCount(recipe, sizeId){
  if(sizeId && recipe.saucesExtraIncludedBySize && recipe.saucesExtraIncludedBySize[sizeId]!=null) return recipe.saucesExtraIncludedBySize[sizeId];
  return recipe.saucesExtraIncluded||0;
}

// Toppings "normales" (pueden entrar en el cupo de gratis) vs "premium" (siempre se cobran,
// nunca cuentan como gratis, y solo se muestran en el POS si el producto tiene toppings gratis).
function getRegularToppings(){ return S.toppings.filter(function(t){return t.active && !t.premium;}); }
function getPremiumToppings(){ return S.toppings.filter(function(t){return t.active && t.premium;}); }
// Precio a cobrar por un topping/salsa adicional en un producto concreto: si el producto tiene un
// precio específico configurado (desde Gramaje por producto en Toppings & Extras), ese manda;
// si no, cae al override de la ficha, y si tampoco hay, al precio global del topping/salsa.
function getExtraChargePrice(item, recipeId, fichaOverride){
  var perProduct=getExtraPriceForRecipe(item, recipeId, null);
  if(perProduct>0) return perProduct;
  return fichaOverride!=null?fichaOverride:item.price;
}
// Calcula, según lo que el cajero YA seleccionó en el POS, cuáles toppings quedan gratis.
// A diferencia del comportamiento anterior (que marcaba "gratis" siempre a los primeros N del
// catálogo, los estuvieras eligiendo o no, o según su posición fija), aquí el cupo se consume
// dinámicamente EN EL ORDEN EN QUE EL CAJERO LOS FUE SELECCIONANDO: el primer topping normal
// que se elige (haya sido el primero o el último en la lista) toma el cupo gratis primero.
function computeToppingPricing(recipeId){
  var r=getRecipeById(recipeId);
  var freeTop=getFreeToppingsCount(r,null);
  var topPrice=r.toppingExtraPriceOverride;
  var sel=(window._custSelection&&window._custSelection.toppings)||{};
  var order=(window._custSelection&&window._custSelection.topOrder)||[];
  var regular=getRegularToppings();
  var premium=getPremiumToppings();
  var regularIds={};
  regular.forEach(function(t){regularIds[t.id]=true;});
  var freeIds={};
  var freeUsed=0;
  order.forEach(function(id){
    if(regularIds[id] && sel[id] && freeUsed<freeTop){ freeIds[id]=true; freeUsed++; }
  });
  var map={};
  regular.forEach(function(t){
    var selected=!!sel[t.id];
    var isFree=!!freeIds[t.id];
    map[t.id]={selected:selected,isFree:isFree,premium:false,price:getExtraChargePrice(t,recipeId,topPrice)};
  });
  premium.forEach(function(t){
    var selected=!!sel[t.id];
    map[t.id]={selected:selected,isFree:false,premium:true,price:getExtraChargePrice(t,recipeId,topPrice)};
  });
  return {map:map, freeTop:freeTop, freeUsed:freeUsed, regular:regular, premium:premium};
}

// Igual que computeToppingPricing pero para salsas: las "incluidas siempre" (s.included) son
// gratis por defecto; las demás consumen el cupo de "extra gratis" dinámicamente EN EL ORDEN
// en que el cajero las fue seleccionando (no según su posición fija en el catálogo).
function computeSaucePricing(recipeId){
  var r=getRecipeById(recipeId);
  var freeExtra=getFreeExtraSaucesCount(r,null);
  var sauPrice=r.sauceExtraPriceOverride;
  var sel=(window._custSelection&&window._custSelection.sauces)||{};
  var order=(window._custSelection&&window._custSelection.sauOrder)||[];
  var list=S.sauces.filter(function(s){return s.active;});
  var extraIds={};
  list.forEach(function(s){ if(!s.included) extraIds[s.id]=true; });
  var freeIds={};
  var freeUsed=0;
  order.forEach(function(id){
    if(extraIds[id] && sel[id] && freeUsed<freeExtra){ freeIds[id]=true; freeUsed++; }
  });
  var map={};
  list.forEach(function(s){
    var selected = s.included ? (sel[s.id]!==false) : !!sel[s.id];
    var isFree = s.included ? true : !!freeIds[s.id];
    map[s.id]={selected:selected,isFree:isFree,included:!!s.included,price:getExtraChargePrice(s,recipeId,sauPrice)};
  });
  return {map:map, freeExtra:freeExtra, freeUsed:freeUsed, list:list};
}

      var canvas=document.createElement('canvas');

function buildExtraConsumptionAnalysis(){
  var rows=S.extraConsumption||[];
  if(rows.length===0){
    return '<div class="alert alert-blue">📊 Todavía no hay ventas con toppings/salsas vinculados a un insumo, así que no hay datos de consumo. En cuanto vendas productos con toppings configurados (insumo + gramaje en la ficha), aquí verás cuánto se gasta de cada uno.</div>';
  }
  function itemOf(itemType,itemId){var coll=itemType==='topping'?S.toppings:S.sauces;return coll.find(function(x){return x.id===itemId;});}
  // Totales por item (todo el histórico) y por mes
  var byItem={};
  var byMonth={};
  rows.forEach(function(r){
    var key=r.itemType+'-'+r.itemId;
    byItem[key]=byItem[key]||{itemType:r.itemType,itemId:r.itemId,grams:0,count:0};
    byItem[key].grams+=r.grams;byItem[key].count++;
    var m=r.date.slice(0,7);
    byMonth[m]=byMonth[m]||{};
    byMonth[m][key]=(byMonth[m][key]||0)+r.grams;
  });
  var ranking=Object.values(byItem).map(function(o){
    var it=itemOf(o.itemType,o.itemId);
    if(!it) return null;
    var costG=getExtraCostPerGram(it);
    return {it:it,grams:o.grams,cost:o.grams*costG,count:o.count};
  }).filter(Boolean).sort(function(a,b){return b.grams-a.grams;});
  var maxGrams=ranking.length>0?ranking[0].grams:1;

  var html='<div class="alert alert-blue">📊 Este análisis se basa en las ventas registradas donde el topping/salsa tenía un insumo vinculado y gramaje configurado para esa ficha. Los toppings sin insumo vinculado no aparecen aquí (no se puede calcular su costo/consumo real).</div>';
  html+='<div class="card"><div class="card-title">Ranking de consumo (todo el histórico) '+infoIcon('Ordenado de mayor a menor gramos consumidos. Te ayuda a saber qué toppings se gastan más y priorizar sus compras.')+'</div>';
  ranking.slice(0,15).forEach(function(r){
    html+='<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px"><span>'+r.it.emoji+' '+r.it.name+'</span><span>'+num2(r.grams)+'g · '+fmt(r.cost)+' · '+r.count+' usos</span></div><div class="progress"><div class="progress-bar" style="width:'+Math.round(r.grams/maxGrams*100)+'%;background:var(--accent)"></div></div></div>';
  });
  html+='</div>';

  html+='<div class="card"><div class="card-title">⏳ Duración estimada del stock actual '+infoIcon('Estima, según el promedio diario de consumo de los últimos 30 días con datos, cuántos días te dura el stock actual del insumo vinculado a cada topping/salsa.')+'</div><div class="table-wrap"><table><thead><tr><th>Topping/Salsa</th><th>Insumo</th><th>Stock actual</th><th>Consumo diario prom.</th><th>Duración estimada</th></tr></thead><tbody>';
  var allDates=rows.map(function(r){return r.date;}).sort();
  var daysSpan=1;
  if(allDates.length>0){
    var first=new Date(allDates[0]);var last=new Date(allDates[allDates.length-1]);
    daysSpan=Math.max(1,Math.round((last-first)/(1000*60*60*24))+1);
  }
  ranking.forEach(function(r){
    var ing=r.it.ingredientId?getIngById(r.it.ingredientId):null;
    var dailyAvg=r.grams/daysSpan;
    var duration=(ing&&dailyAvg>0)?Math.round(ing.stock/dailyAvg):null;
    var durationHtml='sin datos';
    if(duration!=null){
      durationHtml=duration+' días'+(duration<=7?' <span class="badge badge-red">bajo</span>':'');
    }
    html+='<tr><td>'+r.it.emoji+' '+r.it.name+'</td><td>'+(ing?ing.name:'—')+'</td><td>'+(ing?num2(ing.stock)+' '+ing.baseUnit:'—')+'</td><td>'+num2(dailyAvg)+' g/día</td><td>'+durationHtml+'</td></tr>';
  });
  html+='</tbody></table></div></div>';

  html+='<div class="card"><div class="card-title">Consumo por mes (gramos)</div><div class="table-wrap"><table><thead><tr><th>Mes</th><th>Topping/Salsa</th><th>Gramos</th><th>Costo</th></tr></thead><tbody>';
  Object.keys(byMonth).sort().reverse().forEach(function(m){
    Object.keys(byMonth[m]).forEach(function(key){
      var parts=key.split('-');var itemType=parts[0];var itemId=parseInt(parts[1]);
      var it=itemOf(itemType,itemId);
      if(!it) return;
      var g=byMonth[m][key];
      var costG=getExtraCostPerGram(it);
      html+='<tr><td>'+m+'</td><td>'+it.emoji+' '+it.name+'</td><td>'+num2(g)+'g</td><td>'+fmt(g*costG)+'</td></tr>';
    });
  });
  html+='</tbody></table></div></div>';
  return html;
}

  var name=input?input.value.trim():'';
  if(!name) return;
  S.extraCategories[type]=S.extraCategories[type]||[];
  S.extraCategories[type].push({id:uid(),name:name});
  recalcAll();
}
function renameExtraCategory(type,id,name){
  var cat=(S.extraCategories[type]||[]).find(function(c){return c.id===id;});
  if(cat) cat.name=name;
}

// ----- Listado de insumos marcados por bandera (desechable / empaque domicilio), agrupado y sumado por categoría -----
// Suma el valor de los materiales (materia prima) necesarios para preparar los productos,
// agrupado por categoría de la carta, con un total general al final.
function buildRecipeCostByCategorySummary(){
  if(S.recipes.length===0) return '';
  var byCat={};
  S.categories.forEach(function(cat){byCat[cat.id]={cat:cat,recipes:[]};});
  var noCat=[];
  S.recipes.forEach(function(r){
    if(byCat[r.category]) byCat[r.category].recipes.push(r);
    else noCat.push(r);
  });
  var grandTotal=0;
  var html='<div class="card" style="margin-top:16px;background:var(--bg2)"><div class="card-title">🧾 Valor de materiales por categoría '+infoIcon('Suma el costo de materia prima (ingredientes) necesario para preparar cada producto, agrupado por categoría de la carta. El total general es la suma de todas las categorías.')+'</div>';
  S.categories.forEach(function(cat){
    var group=byCat[cat.id];
    if(!group || group.recipes.length===0) return;
    var catTotal=group.recipes.reduce(function(a,r){return a+getRecipeCostPerPortion(r);},0);
    grandTotal+=catTotal;
    html+='<div class="cat-summary-row"><span>'+escAttr(cat.emoji+' '+cat.name)+' <span style="color:var(--text3)">('+group.recipes.length+' productos)</span></span><span style="font-weight:700">'+fmt(catTotal)+'</span></div>';
  });
  if(noCat.length){
    var noCatTotal=noCat.reduce(function(a,r){return a+getRecipeCostPerPortion(r);},0);
    grandTotal+=noCatTotal;
    html+='<div class="cat-summary-row"><span>Sin categoría <span style="color:var(--text3)">('+noCat.length+' productos)</span></span><span style="font-weight:700">'+fmt(noCatTotal)+'</span></div>';
  }
  html+='<div class="cat-summary-total"><span>Total general de la carta</span><span>'+fmt(grandTotal)+'</span></div>';
  html+='</div>';
  return html;
}

function buildIngFlagSummary(flagField,title,icon){
  var items=S.ingredients.filter(function(i){return i[flagField];});
  if(items.length===0){
    return '<div class="card" style="margin-top:16px"><div class="card-title">'+icon+' '+title+'</div><p style="font-size:12px;color:var(--text3)">Todavía no tienes insumos marcados como "'+title+'". Márcalos desde Insumos → columna correspondiente.</p></div>';
  }
  var byCat={};
  items.forEach(function(i){
    var k=i.category||'Sin categoría';
    byCat[k]=byCat[k]||[];
    byCat[k].push(i);
  });
  var grandTotal=0;
  var html='<div class="card" style="margin-top:16px"><div class="card-title">'+icon+' '+title+' — listado por categoría '+infoIcon('Insumos marcados con esta bandera en Insumos, agrupados por su categoría. El total es el valor de stock actual (costo por unidad × stock).')+'</div>';
  Object.keys(byCat).sort().forEach(function(cat){
    var list=byCat[cat];
    var catTotal=list.reduce(function(a,i){return a+getCostPerBase(i)*(parseFloat(i.stock)||0);},0);
    grandTotal+=catTotal;
    html+='<div style="font-size:12px;font-weight:600;color:var(--text2);margin:10px 0 4px">'+escAttr(cat)+' <span style="color:var(--text3);font-weight:400">('+list.length+')</span></div>';
    html+='<div class="table-wrap"><table><tbody>';
    list.forEach(function(i){
      html+='<tr><td>'+escAttr(i.name)+'</td><td style="text-align:right;color:var(--text3)">'+fmt(getCostPerBase(i))+'/'+escAttr(i.baseUnit)+'</td><td style="text-align:right;color:var(--text3)">Stock: '+(i.stock||0)+' '+escAttr(i.baseUnit)+'</td><td style="text-align:right;font-weight:500">'+fmt(getCostPerBase(i)*(parseFloat(i.stock)||0))+'</td></tr>';
    });
    html+='</tbody></table></div>';
    html+='<div style="text-align:right;font-size:12px;color:var(--text2);margin-top:2px">Subtotal '+escAttr(cat)+': <b>'+fmt(catTotal)+'</b></div>';
  });
  html+='<div style="text-align:right;font-size:13px;margin-top:10px;padding-top:8px;border-top:0.5px solid var(--border)">Total general: <b style="color:var(--accent)">'+fmt(grandTotal)+'</b></div>';
  html+='</div>';
  return html;
}

function deleteExtraCategory(type,id){
  askConfirm('¿Eliminar esta categoría? Los elementos que la usan quedarán "Sin categoría".',function(){
    S.extraCategories[type]=(S.extraCategories[type]||[]).filter(function(c){return c.id!==id;});
    var coll = type==='toppings'?S.toppings:(type==='sauces'?S.sauces:S.packagings);
    coll.forEach(function(item){if(item.category===id) item.category=null;});
    recalcAll();
  },{title:'Eliminar categoría'});
}

// ----- Modal de uso: en qué productos se usa un topping/salsa, y cuántos gramos por producto -----
// (cada ficha es ahora su propia presentación independiente, así que ya no hay una dimensión
// de "tamaño" separada dentro de un mismo producto — una columna por ficha es suficiente)
function openExtraUsageModal(kind,itemId){
  var coll = kind==='topping'?S.toppings:S.sauces;
  var item = coll.find(function(x){return x.id===itemId;});
  if(!item) return;
  item.usage = item.usage||[];
  var costG=getExtraCostPerGram(item);
  var head='<tr><th>Producto / presentación</th><th>Gramos</th><th>Costo</th><th>Precio cobrado</th><th>Margen</th></tr>';
  var rows=S.recipes.filter(function(r){return !r.isSubrecipe;}).map(function(r){
    var v=getExtraGramsForRecipeExact(item,r.id,null);
    var p=getExtraPriceForRecipe(item,r.id,null);
    var costo=v?v*costG:0;
    return '<tr><td style="white-space:nowrap">'+r.emoji+' '+r.name+(r.sizeLabel?' — '+escAttr(r.sizeLabel):'')+'</td>'+
      '<td><input class="inline-edit" type="number" style="width:70px" value="'+(v||'')+'" placeholder="0" '+
      'oninput="document.getElementById(\'uv-'+r.id+'\').textContent=(this.value&&parseFloat(this.value)>0?fmt(parseFloat(this.value)*'+costG+'):\'—\');updateUsageMargin(this)" '+
      'onchange="updateFichaUsageCell(\''+kind+'\','+itemId+','+r.id+',null,this.value)"></td>'+
      '<td id="uv-'+r.id+'" style="font-size:12px;color:var(--text2)">'+(v?fmt(costo):'—')+'</td>'+
      '<td><input class="inline-edit" type="number" style="width:80px" value="'+(p||'')+'" placeholder="0 = gratis" '+
      'oninput="updateUsageMargin(this)" '+
      'onchange="updateFichaUsagePriceCell(\''+kind+'\','+itemId+','+r.id+',null,this.value)"></td>'+
      '<td id="um-'+r.id+'" style="font-size:12px;font-weight:600" data-costg="'+costG+'">'+usageMarginLabel(p,costo)+'</td></tr>';
  }).join('');
  var html='<h3>📐 Gramaje de '+item.emoji+' '+item.name+' por producto</h3>\
    <p style="font-size:12px;color:var(--text2);margin-bottom:8px">Escribe cuántos gramos de este topping/salsa lleva cada ficha, y si a ese producto se le cobra aparte, escribe el precio. Deja vacío si esa ficha no lo usa o si es gratis.</p>\
    '+(item.ingredientId?'<div class="alert alert-blue" style="font-size:12px">Costo por gramo (desde el insumo vinculado): <b>'+fmt(costG)+'/g</b></div>':'<div class="alert alert-amber" style="font-size:12px">⚠️ Este topping/salsa no tiene un insumo vinculado todavía, así que aunque definas gramos aquí no vas a tener costo real ni descuento de inventario. Vincúlalo desde la tabla de Toppings/Salsas.</div>')+'\
    <div class="table-wrap"><table><thead>'+head+'</thead><tbody id="usage-grid-body">'+rows+'</tbody></table></div>\
    <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal();recalcAll()">Listo</button></div>';
  openModal(html);
}
function getExtraGramsForRecipeExact(item,recipeId,sizeId){
  var row=(item.usage||[]).find(function(u){return u.recipeId===recipeId && u.sizeId===sizeId;});
  return row?row.grams:null;
}
// Texto/color del margen para una fila de la grilla de gramaje: compara precio cobrado vs costo real del gramaje.
function usageMarginLabel(price,costo){
  price=parseFloat(price)||0;
  if(!costo || costo<=0){
    return price>0?'<span style="color:var(--green,#3b6d11)">'+fmt(price)+' (100%)</span>':'<span style="color:var(--text3)">Gratis</span>';
  }
  if(price<=0) return '<span style="color:var(--text3)">Gratis (costo '+fmt(costo)+')</span>';
  var margen=(price-costo)/price*100;
  var color=margen<0?'var(--red,#e24b4a)':(margen<30?'#c9861a':'var(--green,#3b6d11)');
  return '<span style="color:'+color+'">'+margen.toFixed(0)+'%</span>';
}
// Recalcula en vivo la celda de margen cuando cambian los inputs de gramos o precio de una fila (recibe el input que cambió).
function updateUsageMargin(inputEl){
  var tr=inputEl.closest('tr');
  if(!tr) return;
  var cell=tr.querySelector('td:nth-child(5)');
  if(!cell) return;
  var gInput=tr.querySelector('td:nth-child(2) input');
  var pInput=tr.querySelector('td:nth-child(4) input');
  var costG=parseFloat(cell.getAttribute('data-costg'))||0;
  var g=gInput?(parseFloat(gInput.value)||0):0;
  var p=pInput?(parseFloat(pInput.value)||0):0;
  cell.innerHTML=usageMarginLabel(p,g*costG);
}
function updateFichaUsageCell(kind,itemId,recipeId,sizeId,val){
  var coll = kind==='topping'?S.toppings:S.sauces;
  var item = coll.find(function(x){return x.id===itemId;});
  if(!item) return;
  setUsageGrams(item, recipeId, sizeId, parseFloat(val)||0);
  if(typeof refreshFichaSummary==='function') refreshFichaSummary();
}
function updateFichaUsagePriceCell(kind,itemId,recipeId,sizeId,val){
  var coll = kind==='topping'?S.toppings:S.sauces;
  var item = coll.find(function(x){return x.id===itemId;});
  if(!item) return;
  setUsagePrice(item, recipeId, sizeId, parseFloat(val)||0);
  if(typeof refreshFichaSummary==='function') refreshFichaSummary();
}

window._invUI = window._invUI || {sortField:'name', sortDir:'asc'};
function invSortArrow(field){
  if(window._invUI.sortField!==field) return '';
  return window._invUI.sortDir==='asc' ? ' ▲' : ' ▼';
}
function setInvSort(field){
  if(window._invUI.sortField===field){
    window._invUI.sortDir = window._invUI.sortDir==='asc' ? 'desc' : 'asc';
  } else {
    window._invUI.sortField = field;
    window._invUI.sortDir = 'asc';
  }
  renderInvTableBody();
}
function getSortedInventory(){
  var field=window._invUI.sortField||'name';
  var dir=window._invUI.sortDir==='desc'?-1:1;
  function valOf(ing){
    var cpb=getCostPerBase(ing);
    switch(field){
      case 'stock': return parseFloat(ing.stock)||0;
      case 'minStock': return parseFloat(ing.minStock)||0;
      case 'val': return cpb*ing.stock;
      case 'cpb': return cpb;
      case 'name': default: return (ing.name||'').toLowerCase();
    }
  }
  return S.ingredients.slice().sort(function(a,b){
    var va=valOf(a), vb=valOf(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}
function renderInvTableBody(){
  var el=document.getElementById('inv-table-outer');
  if(!el) return;
  var list=getSortedInventory();
  var thead='<tr>'+
    '<th style="cursor:pointer;user-select:none" onclick="setInvSort(\'name\')">Insumo'+invSortArrow('name')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setInvSort(\'stock\')">Stock actual'+invSortArrow('stock')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setInvSort(\'minStock\')">Mínimo'+invSortArrow('minStock')+'</th>'+
    '<th>% nivel</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setInvSort(\'cpb\')">$/U. base'+invSortArrow('cpb')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setInvSort(\'val\')">Valor'+invSortArrow('val')+'</th>'+
    '<th>Estado</th>'+
  '</tr>';
  var rows=list.map(function(ing){
    var cpb=getCostPerBase(ing);
    var pctLevel=ing.minStock>0?Math.round(ing.stock/ing.minStock*100):100;
    var val=cpb*ing.stock;
    var estado=ing.stock===0?'<span class="badge badge-red">Sin stock</span>':ing.stock<=ing.minStock?'<span class="badge badge-amber">Bajo</span>':'<span class="badge badge-green">OK</span>';
    return '<tr><td>'+ing.name+'</td><td style="white-space:nowrap"><input class="inline-edit" style="width:90px" type="number" value="'+ing.stock+'" onchange="updateIngStock('+ing.id+',this.value)"> '+ing.baseUnit+'</td><td style="white-space:nowrap"><input class="inline-edit" style="width:90px" type="number" value="'+ing.minStock+'" onchange="updateIngMin('+ing.id+',this.value)"> '+ing.baseUnit+'</td><td><div class="progress" style="width:100px"><div class="progress-bar" style="width:'+Math.min(pctLevel,100)+'%;background:'+(pctLevel<=100?'#e24b4a':'#3b6d11')+'"></div></div></td><td>'+fmt(cpb)+'/'+ing.baseUnit+'</td><td>'+fmt(val)+'</td><td>'+estado+'</td></tr>';
  }).join('');
  el.innerHTML='<div class="table-wrap"><table><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}
function renderInventory(c){
  c.innerHTML='<div class="tabs" id="inv-tabs"><div class="tab active" onclick="switchTab(\'inv\',0,this)">Stock</div><div class="tab" onclick="switchTab(\'inv\',1,this)">Alertas</div></div>';
  
  var t0=document.createElement('div');t0.className='tab-content active';t0.id='inv-tab0';

function setPurSort(field){
  if(window._purUI.sortField===field){
    window._purUI.sortDir = window._purUI.sortDir==='asc' ? 'desc' : 'asc';

    window._purUI.sortField = field;
    window._purUI.sortDir = field==='date' ? 'desc' : 'asc';
  }
  renderPurTableBody();
}
function getFilteredSortedPurchases(){
  var q=(window._purUI.q||'').toLowerCase().trim();
  var list=S.purchases.filter(function(p){
    if(!q) return true;
    var ing=getIngById(p.ingId);var sup=S.suppliers.find(function(s){return s.id===p.supplierId});
    return (ing&&ing.name.toLowerCase().indexOf(q)>-1)||(sup&&sup.name.toLowerCase().indexOf(q)>-1);
  });
  var field=window._purUI.sortField||'date';
  var dir=window._purUI.sortDir==='desc'?-1:1;
  function valOf(p){
    switch(field){
      case 'ing': var ing=getIngById(p.ingId); return ing?ing.name.toLowerCase():'';
      case 'cpb': return parseFloat(p.newCostPerBase)||0;
      case 'total': return parseFloat(p.total)||0;
      case 'supplier': var sup=S.suppliers.find(function(s){return s.id===p.supplierId}); return sup?sup.name.toLowerCase():'';
      case 'date': default: return p.date||'';
    }
  }
  list=list.slice().sort(function(a,b){
    var va=valOf(a), vb=valOf(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
  return list;
}

function savePurchase(){
  var ingId=parseInt(document.getElementById('pm-ing').value);
  var supId=parseInt(document.getElementById('pm-sup').value);
  var qty=parseFloat(document.getElementById('pm-qty').value)||0;
  var unit=document.getElementById('pm-unit').value;
  var total=parseFloat(document.getElementById('pm-total').value)||0;
  var updatePrice=document.getElementById('pm-updateprice').checked;
  var ing=getIngById(ingId);
  if(!ing) return;
  var factor=getConversionFactor(unit,ing.baseUnit);
  var baseQty=qty*factor;
  ing.stock+=baseQty;
  var newCostPerBase=ing.buyPrice/(ing.buyQty*getConversionFactor(ing.buyUnit,ing.baseUnit));
  if(updatePrice&&total>0){
    ing.buyPrice=total;ing.buyQty=qty;ing.buyUnit=unit;
    newCostPerBase=getCostPerBase(ing);
  }
  S.purchases.push({id:uid(),date:nowStamp(),ingId:ingId,supplierId:supId,qty:qty,unit:unit,total:total,newCostPerBase:newCostPerBase});
  closeModal();recalcAll();showToast('✅ Compra registrada');
}

function calcMaxPortions(recipe){
  var max=Infinity;
  recipe.ingredients.forEach(function(ri){
    if(ri.ref!=='ing') return;
    var ing=getIngById(ri.id);if(!ing) return;
    var factor=getConversionFactor(ri.unit,ing.baseUnit);
    var realQtyPerPortion=ri.qty*factor*(1+(ri.wastePct||0)/100);
    if(realQtyPerPortion>0) max=Math.min(max,Math.floor(ing.stock/realQtyPerPortion));
  });
  return max===Infinity?0:max;
}

function openProduceModal(id,maxP){
  var r=getRecipeById(id);
  var html='<h3>Producir — '+r.emoji+' '+r.name+'</h3>\
    <p style="font-size:13px;color:var(--text2);margin-bottom:12px">Máximo posible: <b>'+maxP+'</b> porciones</p>\
    <div class="form-group"><label>Porciones a producir</label><input type="number" id="prod-qty" value="'+maxP+'" min="1" max="'+maxP+'"></div>\
    <div class="modal-footer"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmProduce('+id+','+maxP+')">Confirmar producción</button></div>';
  openModal(html);
}

function confirmProduce(id,maxP){
  var qty=parseInt(document.getElementById('prod-qty').value)||0;
  if(qty<=0||qty>maxP){showToast('Cantidad inválida');return;}
  var r=getRecipeById(id);
  r.ingredients.forEach(function(ri){
    if(ri.ref!=='ing') return;
    var ing=getIngById(ri.id);if(!ing) return;
    var factor=getConversionFactor(ri.unit,ing.baseUnit);
    var realQty=ri.qty*factor*(1+(ri.wastePct||0)/100)*qty;
    ing.stock=Math.max(0,ing.stock-realQty);
  });
  S.productionHistory.push({date:nowStamp(),recipeId:id,qty:qty});
  closeModal();recalcAll();showToast('✅ Producción registrada');
}

function renderPOS(){

  if(catDiv){
    catDiv.innerHTML='';
