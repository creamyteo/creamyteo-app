function renderIngredients(c){
  migrateStateV53();
  c.innerHTML='<div class="tabs" id="ing-tabs"><div class="tab active" onclick="switchTab(\'ing\',0,this)">Lista</div><div class="tab" onclick="switchTab(\'ing\',1,this)">Conversiones</div><div class="tab" onclick="switchTab(\'ing\',2,this)">Fórmulas</div></div>';

  var t0=document.createElement('div');t0.className='tab-content active';t0.id='ing-tab0';
  var addBtn='<div class="section-header"><h3>Insumos</h3><button type="button" class="btn btn-primary btn-sm" onclick="openIngModal()">+ Nuevo insumo</button></div>';
  var toolbar='<div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">'+
    '<input type="text" id="ing-search" placeholder="🔍 Buscar por nombre, categoría o proveedor..." style="flex:1;min-width:220px;padding:8px 10px;border:0.5px solid var(--border2);border-radius:8px;background:var(--bg);color:var(--text)" value="'+escAttr(window._ingUI.q)+'" oninput="window._ingUI.q=this.value;renderIngTableBody();">'+
    '<button type="button" class="btn btn-sm" onclick="document.getElementById(\'ing-search\').value=\'\';window._ingUI.q=\'\';renderIngTableBody();">✕ Limpiar</button>'+
    '</div>';
  t0.innerHTML=addBtn+toolbar+'<div id="ing-table-outer"></div>';
  c.appendChild(t0);
  renderIngTableBody();

  var t1=document.createElement('div');t1.className='tab-content';t1.id='ing-tab1';
  var convHtml='<h3 style="font-size:13px;margin-bottom:12px">Factores de conversión a unidad base</h3><div class="table-wrap"><table><thead><tr><th>Unidad</th><th>Tipo</th><th>Factor (→ unidad base)</th></tr></thead><tbody>';
  for(var grp in S.conversionFormulas){
    for(var unit in S.conversionFormulas[grp]){
      convHtml+='<tr><td>'+unit+'</td><td>'+grp+'</td><td><input class="inline-edit" type="number" step="0.001" value="'+S.conversionFormulas[grp][unit]+'" onchange="updateConvFactor(\''+grp+'\',\''+unit+'\',this.value)" style="width:100px"></td></tr>';
    }
  }
  convHtml+='</tbody></table></div>';
  t1.innerHTML=convHtml;
  c.appendChild(t1);

  var t2=document.createElement('div');t2.className='tab-content';t2.id='ing-tab2';
  var fHtml='<h3 style="font-size:13px;margin-bottom:12px">Fórmulas de conversión</h3>';
  for(var g2 in S.conversionFormulas){
    fHtml+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font-weight:500;font-size:13px">'+g2.toUpperCase()+'</b><button type="button" class="btn btn-sm" onclick="restoreFormulas(\''+g2+'\')">↺ Restaurar</button></div>';
    for(var u in S.conversionFormulas[g2]){
      fHtml+='<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border)"><span style="font-size:13px">1 '+u+' =</span><div style="display:flex;align-items:center;gap:8px"><input class="inline-edit" type="number" style="width:100px" value="'+S.conversionFormulas[g2][u]+'" onchange="updateConvFactor(\''+g2+'\',\''+u+'\',this.value)"><span style="font-size:12px;color:var(--text3)">'+g2+'</span><button type="button" class="btn btn-sm" onclick="restoreOneFormula(\''+g2+'\',\''+u+'\')">↺</button></div></div>';
    }
    fHtml+='</div>';
  }
  fHtml+='<button type="button" class="btn btn-sm" onclick="restoreFormulas()">↺ Restaurar todas</button>';
  fHtml+='<div class="card" style="margin-top:16px"><div class="card-title">Unidades personalizadas</div>';
  S.customUnits.forEach(function(cu){
    fHtml+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:0.5px solid var(--border)"><span>'+escAttr(cu.name)+' = '+cu.factor+' '+escAttr(cu.base)+'</span><button type="button" class="btn btn-sm btn-danger" onclick="deleteCustomUnit('+cu.id+')">🗑</button></div>';
  });
  fHtml+='<div style="display:flex;gap:8px;margin-top:10px">\
    <input type="text" id="cu-name" placeholder="Nombre (ej. costal)" style="flex:1">\
    <input type="number" id="cu-factor" placeholder="Factor" style="width:90px">\
    <select id="cu-base" style="width:80px"><option value="g">g</option><option value="ml">ml</option><option value="und">und</option></select>\
    <button type="button" class="btn btn-sm btn-primary" onclick="addCustomUnit()">+ Agregar</button></div>';
  fHtml+='</div>';
  t2.innerHTML=fHtml;
  c.appendChild(t2);
}
function setIngFlag(id,field,val){
  var ing=getIngById(id);
  if(ing){ ing[field]=val; recalcAll(); }
}
