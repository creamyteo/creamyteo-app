  }
  var search=document.getElementById('pos-search');
  var q=search?search.value.toLowerCase():'';
  // Las subrecetas y las presentaciones/productos inactivos nunca se muestran en el POS.
  var sellable=S.recipes.filter(function(r){ return !r.isSubrecipe && r.active!==false; });
  // Agrupa por producto (carpeta): un producto con varias presentaciones aparece como UNA sola
  // tarjeta en el POS; al hacer clic se elige el tamaño y luego se ve el precio real de esa ficha.
  var posItems=posBuildSellableGroups(sellable);
  var filtered=posItems.filter(function(pi){
    if(S.posCategory!=='Todos'){var cat=S.categories.find(function(c){return c.id===pi.categoryId});if(!cat||cat.name!==S.posCategory) return false;}
    return pi.name.toLowerCase().includes(q);
  });
  var grid=document.getElementById('pos-grid');
  if(!grid) return;
  grid.innerHTML='';
  function makeCard(pi){
    var div=document.createElement('div');
    div.className='product-card';
    var media=pi.photo?'<img src="'+pi.photo+'" class="product-photo">':'<span class="product-emoji">'+pi.emoji+'</span>';
    var priceLabel=pi.priceMin===pi.priceMax?fmt(pi.priceMin):('Desde '+fmt(pi.priceMin));
    div.innerHTML=media+'<div class="product-name">'+escAttr(pi.name)+'</div><div class="product-price">'+priceLabel+'</div>';
    div.onclick=function(){
      if(pi.presentations.length>1) openSizePickerModal(pi);
      else openProductCustomizer(pi.presentations[0].id);
    };
    return div;
  }
  if(S.posCategory==='Todos'){
    S.categories.forEach(function(cat){
      var items=filtered.filter(function(pi){return pi.categoryId===cat.id});
      if(items.length===0) return;
      var groupDiv=document.createElement('div');
      groupDiv.className='pos-cat-group';
      groupDiv.innerHTML='<div class="pos-cat-title">'+cat.emoji+' '+cat.name+'</div>';
      var gridInner=document.createElement('div');
      gridInner.className='product-grid';
      items.forEach(function(pi){gridInner.appendChild(makeCard(pi));});
      groupDiv.appendChild(gridInner);
      grid.appendChild(groupDiv);
    });
    var noCat=filtered.filter(function(pi){return !S.categories.find(function(c){return c.id===pi.categoryId});});
    if(noCat.length>0){
      var gd2=document.createElement('div');gd2.className='pos-cat-group';
      gd2.innerHTML='<div class="pos-cat-title">Sin categoría</div>';
      var gi2=document.createElement('div');gi2.className='product-grid';
      noCat.forEach(function(pi){gi2.appendChild(makeCard(pi));});
      gd2.appendChild(gi2);grid.appendChild(gd2);
    }
  } else {
    filtered.forEach(function(pi){grid.appendChild(makeCard(pi));});
  }
  renderCart();

  var payDiv=document.getElementById('payment-methods');
  if(payDiv){
    payDiv.innerHTML='';
    ['Efectivo','Tarjeta débito','Nequi','Daviplata','Transferencia'].forEach(function(m){
      var btn=document.createElement('button');
      btn.className='payment-btn'+(S.paymentMethod===m?' active':'');
      btn.textContent=m;btn.onclick=function(){S.paymentMethod=m;renderCart();};
      payDiv.appendChild(btn);
    });
  }
}

// Agrupa las fichas vendibles por producto (carpeta): un producto con folderId se convierte en UNA
// tarjeta con varias presentaciones; una ficha sin folderId se vende directo, como su propia tarjeta.
function posBuildSellableGroups(sellable){
  var byFolder={};
  var loose=[];
  sellable.forEach(function(r){
    if(r.folderId){ byFolder[r.folderId]=byFolder[r.folderId]||[]; byFolder[r.folderId].push(r); }
    else loose.push(r);
  });
  var groups=[];
  Object.keys(byFolder).forEach(function(fid){
    var f=S.productFolders.find(function(x){return x.id===parseInt(fid);});
    if(!f || f.active===false) return;
    var list=byFolder[fid].slice().sort(function(a,b){return (a.basePrice||0)-(b.basePrice||0);});
    if(list.length===0) return;
    var prices=list.map(function(r){return r.basePrice||0;});
    groups.push({
      isFolder:true, folderId:f.id, name:f.name, emoji:list[0].emoji||'🍓', photo:list[0].photo||null,
      categoryId:f.categoryId, priceMin:Math.min.apply(null,prices), priceMax:Math.max.apply(null,prices),
      presentations:list
    });
  });
  loose.forEach(function(r){
    groups.push({
      isFolder:false, folderId:null, name:r.name, emoji:r.emoji, photo:r.photo,
      categoryId:r.category, priceMin:r.basePrice||0, priceMax:r.basePrice||0,
      presentations:[r]
    });
  });
  return groups;
}

// Marca/desmarca un topping en el POS y registra el ORDEN en que el cajero lo fue seleccionando,
// para que el cupo de "gratis" se asigne al que se eligió primero (no al que aparece primero en el catálogo).
function toggleCustTopping(recipeId,topId){
  var sel=window._custSelection.toppings;
  sel[topId]=!sel[topId];
  window._custSelection.topOrder=window._custSelection.topOrder||[];
  var order=window._custSelection.topOrder;
  var idx=order.indexOf(topId);
  if(sel[topId]){ if(idx===-1) order.push(topId); }
  else if(idx>-1){ order.splice(idx,1); }
  refreshExtrasChips(recipeId);
}
// Igual que toggleCustTopping pero para salsas extra (no aplica a las "incluidas siempre").
function toggleCustSauce(recipeId,sauId,included){
  var sel=window._custSelection.sauces;
  if(included){ sel[sauId]=(sel[sauId]===false)?true:false; }
  else{ sel[sauId]=!sel[sauId]; }
  window._custSelection.sauOrder=window._custSelection.sauOrder||[];
  var order=window._custSelection.sauOrder;
  var idx=order.indexOf(sauId);
  if(!included){
    if(sel[sauId]){ if(idx===-1) order.push(sauId); }
    else if(idx>-1){ order.splice(idx,1); }
  }
  refreshExtrasChips(recipeId);
}
function refreshExtrasChips(recipeId){
  var r=getRecipeById(recipeId);
  var pricing=computeToppingPricing(recipeId);
  var freeTop=pricing.freeTop;
  var sauPricing=computeSaucePricing(recipeId);
  var freeSauExtra=sauPricing.freeExtra;

  var topTitle=document.getElementById('cust-top-title');
  if(topTitle) topTitle.textContent='🌾 Toppings — '+freeTop+' gratis incluidos';
  var topGrid=document.getElementById('cust-top-grid');
  if(topGrid){
    topGrid.innerHTML='';
    pricing.regular.forEach(function(t){
      var info=pricing.map[t.id];
      var div=document.createElement('div');
      div.className='extra-chip'+(info.selected?' selected':'');
      div.id='chip-top-'+t.id;
      // El precio solo se muestra si ya se seleccionó y quedó fuera del cupo gratis.
      var tag = (info.selected && !info.isFree) ? '<span class="chip-price">+'+fmt(info.price)+'</span>' : '';
      div.innerHTML=t.emoji+' '+t.name+tag;
      div.onclick=function(){toggleCustTopping(recipeId,t.id);};
      topGrid.appendChild(div);
    });
  }

  // Toppings premium: nunca son gratis y solo aparecen si el producto tiene toppings gratis habilitados.
  var premCard=document.getElementById('cust-top-premium-card');
  var premTitle=document.getElementById('cust-top-premium-title');
  if(premTitle) premTitle.textContent='💎 Toppings Premium — siempre con costo adicional';
  var premGrid=document.getElementById('cust-top-premium-grid');
  var showPremium = freeTop>0 && pricing.premium.length>0;
  if(premCard) premCard.style.display = showPremium ? '' : 'none';
  if(premGrid){
    premGrid.innerHTML='';
    if(showPremium){
      pricing.premium.forEach(function(t){
        var info=pricing.map[t.id];
        var div=document.createElement('div');
        div.className='extra-chip'+(info.selected?' selected':'');
        div.id='chip-top-'+t.id;
        var tag = info.selected ? '<span class="chip-price">+'+fmt(info.price)+'</span>' : '';
        div.innerHTML=t.emoji+' '+t.name+tag;
        div.onclick=function(){toggleCustTopping(recipeId,t.id);};
        premGrid.appendChild(div);
      });
    }
  }

  var sauTitle=document.getElementById('cust-sau-title');
  if(sauTitle) sauTitle.textContent='🫙 Salsas — '+freeSauExtra+' extra gratis (además de las incluidas)';
  var sauGrid=document.getElementById('cust-sau-grid');
  if(sauGrid){
    sauGrid.innerHTML='';
    sauPricing.list.forEach(function(s){
      var info=sauPricing.map[s.id];
      var div=document.createElement('div');
      div.className='extra-chip'+(info.selected?' selected':'');
      div.id='chip-sau-'+s.id;
      // El precio solo se muestra si ya se seleccionó y las salsas gratis establecidas ya se usaron.
      var tag = (info.selected && !info.isFree) ? '<span class="chip-price">+'+fmt(info.price)+'</span>' : '';
      div.innerHTML=s.emoji+' '+s.name+tag;
      div.onclick=function(){
        toggleCustSauce(recipeId,s.id,!!s.included);
      };
      sauGrid.appendChild(div);
    });
  }
  updateCustomizerPreview(recipeId);
}

function custQtyChange(d){
  window._custQty=Math.max(1,(window._custQty||1)+d);
  var el=document.getElementById('cust-qty');if(el)el.textContent=window._custQty;
  if(window._custRecipeId) updateCustomizerPreview(window._custRecipeId);
}

function updateCustomizerPreview(recipeId){
  var r=getRecipeById(recipeId);
  var basePrice=r.basePrice||0;
  var extraPrice=0;
  var reasonEl=document.getElementById('cust-reason');
  var reason=reasonEl?reasonEl.value:'Venta';
  var pricing=computeToppingPricing(recipeId);
  pricing.regular.concat(pricing.premium).forEach(function(t){
    var info=pricing.map[t.id];
    if(info.selected && !info.isFree && reason==='Venta') extraPrice+=info.price;
  });
  var sauPricing=computeSaucePricing(recipeId);
  sauPricing.list.forEach(function(s){
    var info=sauPricing.map[s.id];
    if(info.selected && !info.isFree && reason==='Venta') extraPrice+=info.price;
  });
  var total=basePrice+extraPrice;
  var pkgCost=getRecipePackagingCostAll(r, null);
  var extrasCost=0;
  S.toppings.filter(function(t){return t.active}).forEach(function(t){
    if(window._custSelection.toppings[t.id]) extrasCost+=getExtraCostForRecipe(t, recipeId, null);
  });
  S.sauces.filter(function(s){return s.active}).forEach(function(s){
    var selected = s.included ? (window._custSelection.sauces[s.id]!==false) : !!window._custSelection.sauces[s.id];
    if(selected) extrasCost+=getExtraCostForRecipe(s, recipeId, null);
  });
  var cost=getRecipeCostPerPortion(r) + pkgCost + getRecipeDisposablesCost(r) + extrasCost;
  var margin=total>0?(total-cost)/total*100:0;
  var qty=window._custQty||1;
  var p=document.getElementById('cust-preview');
  if(p) p.innerHTML='<div style="display:flex;justify-content:space-between"><span>Subtotal</span><span style="font-weight:500">'+fmt(total*qty)+'</span></div><div style="display:flex;justify-content:space-between;color:var(--text3)"><span>Costo est. (incl. empaque, desechables y toppings/salsas reales)</span><span>'+fmt(cost*qty)+'</span></div><div style="display:flex;justify-content:space-between"><span>Margen</span><span style="color:'+(margin>=20?'var(--green)':'var(--red)')+'">'+pct(margin)+'</span></div>';
}

function addToCart(recipeId){
  var r=getRecipeById(recipeId);
  var basePrice=r.basePrice||0;
  var extraPrice=0;
  var reasonEl=document.getElementById('cust-reason');
  var reason=reasonEl?reasonEl.value:'Venta';
  var selectedTops=[];var selectedSauces=[];
  var extrasUsed=[]; // {itemType, itemId, grams} para descontar inventario y registrar consumo
  var extrasCost=0;
  var pricing=computeToppingPricing(recipeId);
  pricing.regular.concat(pricing.premium).forEach(function(t){
    var info=pricing.map[t.id];
    if(info.selected){
      selectedTops.push(t.name+(info.premium?' 💎':''));
      if(!info.isFree && reason==='Venta') extraPrice+=info.price;
      var grams=getExtraGramsForRecipe(t,recipeId,null);
      if(grams>0){extrasUsed.push({itemType:'topping',itemId:t.id,grams:grams});extrasCost+=grams*getExtraCostPerGram(t);}
    }
  });
  var sauPricing=computeSaucePricing(recipeId);
  sauPricing.list.forEach(function(s){
    var info=sauPricing.map[s.id];
    if(info.selected) selectedSauces.push(s.name);
    if(info.selected && !info.isFree && reason==='Venta') extraPrice+=info.price;
    if(info.selected){
      var grams=getExtraGramsForRecipe(s,recipeId,null);
      if(grams>0){extrasUsed.push({itemType:'sauce',itemId:s.id,grams:grams});extrasCost+=grams*getExtraCostPerGram(s);}
    }
  });
  var price=basePrice+extraPrice;
  var pkgCost=getRecipePackagingCostAll(r, null);
  var cost=getRecipeCostPerPortion(r) + pkgCost + getRecipeDisposablesCost(r) + extrasCost;
  var qty=window._custQty||1;

// Descuenta del inventario los insumos base de una receta, expandiendo recursivamente cualquier
// subreceta que use como ingrediente (ej. "Crema de la casa" dentro de "Fresas con crema").
// `portions` = cuántas veces se preparó esta receta completa (para una subreceta, es la fracción
// de un lote completo que se consumió).
function deductRecipeStockUsage(recipe, portions, visited){
  if(!recipe || portions<=0) return;
  visited = visited || {};
  if(visited[recipe.id]) return;
  visited[recipe.id]=true;
  (recipe.ingredients||[]).forEach(function(ri){
    if(ri.ref==='ing'){
      var ing=getIngById(ri.id); if(!ing) return;
      var factor=getConversionFactor(ri.unit, ing.baseUnit);
      var realQty=ri.qty*factor*(1+(ri.wastePct||0)/100)*portions;
      ing.stock=Math.max(0, ing.stock-realQty);
    } else if(ri.ref==='recipe'){
      var sub=getRecipeById(ri.id); if(!sub) return;
      var subWeight=getSubrecipeWeight(sub);
      var batchFraction = subWeight>0 ? (ri.qty*portions)/subWeight : 0;
      deductRecipeStockUsage(sub, batchFraction, Object.assign({},visited));
    }
  });
}
function cobrar(){
  if(S.cart.length===0){showToast('Carrito vacío');return;}
  var total=S.cart.reduce(function(a,i){return a+i.price*i.qty},0);
  var cost=S.cart.reduce(function(a,i){return a+i.cost*i.qty},0);
  var saleItems=S.cart.map(function(i){return {recipeId:i.recipeId,name:i.name,qty:i.qty,price:i.price,cost:i.cost,size:i.size}});
  var today=nowStamp();
  S.cart.forEach(function(item){
    var r=getRecipeById(item.recipeId);if(!r) return;
    // Cada presentación ya tiene su propia receta exacta — ya no se necesita multiplicar por tamaño.
    deductRecipeStockUsage(r, item.qty);
    // Descontar del inventario el gramaje real de toppings/salsas usados, y registrar el consumo para el análisis mensual
    (item.extrasUsed||[]).forEach(function(eu){
      var coll = eu.itemType==='topping'?S.toppings:S.sauces;
      var it = coll.find(function(x){return x.id===eu.itemId;});
      if(!it||!it.ingredientId) return;
      var ing=getIngById(it.ingredientId);
      if(!ing) return;
      var totalGrams=eu.grams*item.qty;
      ing.stock=Math.max(0,ing.stock-totalGrams);
      S.extraConsumption.push({date:today,itemType:eu.itemType,itemId:eu.itemId,recipeId:item.recipeId,grams:totalGrams});
    });
  });
  S.sales.push({id:uid(),date:today,items:saleItems,total:total,cost:cost,method:S.paymentMethod,cashier:S.currentUser?S.currentUser.name:'Sistema'});
  sendOrderWhatsApp(saleItems,total);
  clearCart();
  saveData();
  showToast('✅ Venta registrada — '+fmt(total));
  calcAlerts();
}

function sendOrderWhatsApp(items,total){
  var num = (S.currentUser&&S.currentUser.whatsapp) ? S.currentUser.whatsapp : S.whatsappDefault;

  var url='https://wa.me/'+num.replace(/[^0-9]/g,'')+'?text='+encodeURIComponent(msg);
  window.open(url,'_blank');
}

function setSalSort(field){

function getSortedSales(){
  var field=window._salUI.sortField||'date';
  var dir=window._salUI.sortDir==='desc'?-1:1;
  function valOf(s){
    switch(field){
      case 'total': return parseFloat(s.total)||0;
      case 'cost': return parseFloat(s.cost)||0;
      case 'method': return (s.method||'').toLowerCase();
      case 'date': default: return s.date||'';
    }
  }
  return S.sales.slice().sort(function(a,b){
    var va=valOf(a), vb=valOf(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}

function addEquipment(){S.equipment.push({id:uid(),name:'Nuevo activo',cost:0,usefulLifeMonths:36,active:false});recalcAll();}
function updateEquipment(id,key,val){
  var e=S.equipment.find(function(x){return x.id===id});
  if(!e) return;
  if(key==='active') e.active=val;
  else if(key==='cost'||key==='usefulLifeMonths') e[key]=parseFloat(val)||0;
  else e[key]=val;
  recalcAll();
}
function deleteEquipment(id){askConfirm('¿Eliminar este activo?',function(){S.equipment=S.equipment.filter(function(e){return e.id!==id});recalcAll();},{title:'Eliminar activo'});}

function renderAudit(c){
  var recOpts=S.recipes.map(function(r){return '<option value="'+r.id+'"'+(S.auditRecipeId===r.id?' selected':'')+'>'+r.emoji+' '+r.name+'</option>'}).join('');
  c.innerHTML='<div class="form-group" style="max-width:300px"><label>Seleccionar ficha</label><select id="audit-sel" onchange="S.auditRecipeId=parseInt(this.value);renderPage(\'audit\',document.getElementById(\'pages-container\').firstChild)">'+recOpts+'</select></div>';
  if(!S.auditRecipeId&&S.recipes.length>0) S.auditRecipeId=S.recipes[0].id;
  var r=S.auditRecipeId?getRecipeById(S.auditRecipeId):null;
  if(!r){c.innerHTML+='<p style="color:var(--text3)">Selecciona una ficha</p>';return;}

  var lines=[];
  r.ingredients.forEach(function(ri,idx){
    var ing=ri.ref==='ing'?getIngById(ri.id):null;
    if(!ing) return;
    var factor=getConversionFactor(ri.unit,ing.baseUnit);
    var realQty=ri.qty*factor*(1+(ri.wastePct||0)/100);
    var cpbVal=getCostPerBase(ing);
    var cost=realQty*cpbVal;
    var key='mp-'+idx;
    if(!(key in S.auditActiveLines)) S.auditActiveLines[key]=true;
    lines.push({key:key,group:'Materia prima',label:ing.name+' ('+ri.qty+' '+ri.unit+') — '+fmt(cpbVal)+'/'+ing.baseUnit+' '+trendBadge(getIngTrend(ing)),cost:cost});
  });
  (r.packaging||[]).forEach(function(p){
    var pk=S.packagings.find(function(x){return x.id===p.id});
    if(!pk) return;
    var key='pkg-'+p.id;
    if(!(key in S.auditActiveLines)) S.auditActiveLines[key]=true;
    lines.push({key:key,group:'Empaques',label:pk.emoji+' '+pk.name+' ×'+p.qty+(pk.optional?' <span class="badge badge-blue">opcional en venta</span>':''),cost:pk.cost*p.qty});
  });
  var fixedAssigned=getRecipeFixedAssigned(r);
  var key2='fixed';
  if(!(key2 in S.auditActiveLines)) S.auditActiveLines[key2]=(r.includeFixed!==false);
  lines.push({key:key2,group:'Costos fijos',label:(S.costAllocation.method==='auto'?'Asignación automática — promedio mensual':pct(r.fixedCostPct||0)+' manual')+' (factor '+(r.fixedFactor!=null?r.fixedFactor:1)+'x)'+(r.includeFixed===false?' <span class="badge badge-gray">deshabilitado en la ficha</span>':''),cost:fixedAssigned});
  if(r.includeEquip){
    var keyEq='equip';
    if(!(keyEq in S.auditActiveLines)) S.auditActiveLines[keyEq]=true;
    lines.push({key:keyEq,group:'Costos fijos',label:'Depreciación de equipos (activos habilitados)',cost:getEquipmentCostPerUnit()*(r.fixedFactor!=null?r.fixedFactor:1)});
  }
  (r.varCosts||[]).forEach(function(v,idx){
    var key3='var-'+idx;
    if(!(key3 in S.auditActiveLines)) S.auditActiveLines[key3]=true;
    lines.push({key:key3,group:'Costos variables',label:v.name,cost:v.value});
  });
  var tax=r.taxId?S.taxes.find(function(t){return t.id===r.taxId}):null;
  if(tax){
    var taxBase=lines.reduce(function(a,l){return a+(S.auditActiveLines[l.key]?l.cost:0)},0);
    var taxAmt=taxBase*tax.pct/100;
    var keyTax='tax';
    if(!(keyTax in S.auditActiveLines)) S.auditActiveLines[keyTax]=true;
    lines.push({key:keyTax,group:'Impuestos',label:tax.name+' ('+tax.pct+'%)',cost:taxAmt,dynamic:true});
  }

  var realTotal=lines.reduce(function(a,l){return a+l.cost},0);
  var simTotal=lines.reduce(function(a,l){return a+(S.auditActiveLines[l.key]?l.cost:0)},0);
  var diff=realTotal-simTotal;
  var simMargin=r.basePrice>0?(r.basePrice-simTotal)/r.basePrice*100:0;

  var html='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">\
    <button class="btn btn-sm" onclick="auditScenario(\'notax\')">Sin impuestos</button>\
    <button class="btn btn-sm" onclick="auditScenario(\'nopkg\')">Sin empaques</button>\
    <button class="btn btn-sm" onclick="auditScenario(\'nofixed\')">Sin costo fijo</button>\
    <button class="btn btn-sm" onclick="auditScenario(\'novar\')">Sin costos variables</button>\
    <button class="btn btn-sm" onclick="auditScenario(\'restore\')">↺ Restaurar todo</button>\
  </div>';

  var groups={};
  lines.forEach(function(l){groups[l.group]=groups[l.group]||[];groups[l.group].push(l);});
  for(var grp in groups){
    html+='<div class="card"><div class="card-title">'+grp+'</div>';
    groups[grp].forEach(function(l){
      var active=S.auditActiveLines[l.key];
      html+='<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:0.5px solid var(--border)"><input type="checkbox" '+(active?'checked':'')+' onchange="S.auditActiveLines[\''+l.key+'\']=this.checked;renderPage(\'audit\',document.getElementById(\'pages-container\').firstChild)"><span style="flex:1;font-size:13px'+(active?'':';color:var(--text3);text-decoration:line-through')+'">'+l.label+'</span><span style="font-size:13px">'+fmt(l.cost)+'</span></div>';
    });
    var groupTotal=groups[grp].reduce(function(a,l){return a+l.cost},0);
    html+='<div style="text-align:right;font-size:12px;color:var(--text2);padding-top:6px">Subtotal: '+fmt(groupTotal)+'</div></div>';
  }

  var weight=getRecipeTotalWeight(r);
  html+='<div class="card" style="background:var(--bg2)"><div class="card-title">Gramaje y costo por gramo</div>\
    <div class="pl-row"><span>Gramaje aprox. de la porción</span><span>'+num2(weight)+' g/ml</span></div>\
    <div class="pl-row"><span>Costo real total / gramo</span><span>'+(weight>0?fmt(realTotal/weight):'—')+'/g</span></div>\
    <div class="pl-row"><span>Costo simulado / gramo</span><span>'+(weight>0?fmt(simTotal/weight):'—')+'/g</span></div></div>';

  html+='<div class="card" style="background:var(--blue-bg);border-color:#b5d4f4"><div class="card-title" style="color:var(--blue)">Comparación de impacto</div>\
    <div class="pl-row"><span>Costo real (todo activo)</span><span>'+fmt(realTotal)+'</span></div>\
    <div class="pl-row"><span>Costo escenario simulado</span><span>'+fmt(simTotal)+'</span></div>\
    <div class="pl-row"><span>Diferencia</span><span style="color:var(--green)">−'+fmt(diff)+'</span></div>\
    <div class="pl-row bold"><span>Margen escenario</span><span style="color:'+(simMargin>0?'var(--green)':'var(--red)')+'">'+pct(simMargin)+'</span></div>\
  </div>';

  var effMargin=getEffectiveMargin(r);
  var suggestedPrice=effMargin<100?simTotal/(1-effMargin/100):simTotal*2;
  html+='<button class="btn btn-primary" onclick="applySuggestedPrice('+r.id+','+round2(suggestedPrice)+')">💡 Sugerir precio con margen objetivo ('+fmt(suggestedPrice)+')</button>';

  c.innerHTML+=html;
}

function auditScenario(type){
  Object.keys(S.auditActiveLines).forEach(function(k){
    if(type==='notax'&&k==='tax') S.auditActiveLines[k]=false;
    else if(type==='nopkg'&&k.startsWith('pkg-')) S.auditActiveLines[k]=false;
    else if(type==='nofixed'&&k==='fixed') S.auditActiveLines[k]=false;
    else if(type==='novar'&&k.startsWith('var-')) S.auditActiveLines[k]=false;
    else if(type==='restore') S.auditActiveLines[k]=true;
  });
  recalcAll();
}

function applySuggestedPrice(id,price){
  askConfirm('¿Aplicar precio sugerido '+fmt(price)+' a esta ficha?',function(){
    var r=getRecipeById(id);if(r)r.basePrice=price;
    recalcAll();showToast('✅ Precio actualizado');
  },{title:'Aplicar precio sugerido',yesLabel:'Aplicar',danger:false});
}

function utf8ToBase64(str){
  // Codifica un string UTF-8 (con tildes, ñ, etc.) a base64 de forma segura.
  return btoa(unescape(encodeURIComponent(str)));
}
function arrayBufferToBase64(buffer){
  var bytes=new Uint8Array(buffer);
  var chunk=0x8000, binary='';
  for(var i=0;i<bytes.length;i+=chunk){
    binary+=String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  }
  return btoa(binary);
}
function triggerDownload(filename,csv){
  // Usamos data: URI en base64 en vez de blob: porque algunos entornos (vistas
  // previas embebidas, iframes con CSP estricta) bloquean blob: con
  // ERR_BLOCKED_BY_CSP, y además esos mismos entornos esperan que el data: URI
  // venga codificado en base64 (si no, fallan al intentar decodificarlo con atob).
  try{
    var b64=utf8ToBase64(csv);
    var dataUri='data:text/csv;charset=utf-8;base64,'+b64;
    var a=document.createElement('a');
    a.href=dataUri;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    // Último recurso: abrir en pestaña nueva para que el usuario pueda guardar manualmente
    var w=window.open();
    if(w){ w.document.write('<pre>'+csv.replace(/</g,'&lt;')+'</pre>'); w.document.title=filename; }
    else { showToast('⚠️ No se pudo descargar. Habilita las ventanas emergentes o copia los datos manualmente.'); return; }
  }
}
function triggerDownloadBinary(filename,arrayBuffer,mime){
  try{
    var b64=arrayBufferToBase64(arrayBuffer);
    var dataUri='data:'+mime+';base64,'+b64;
    var a=document.createElement('a');
    a.href=dataUri;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(e){
    showToast('⚠️ No se pudo generar el archivo Excel. Verifica tu conexión a internet (se necesita la primera vez para cargar el motor de Excel) e inténtalo de nuevo.');
    console.error(e);
  }
}
function exportCSV(filename,headers,rows){
  var csv=headers+'\n'+rows.join('\n');
  triggerDownload(filename,csv);
  showToast('📥 Descargando '+filename);
}

// ============================================================
// EXCEL (.xlsx) — construcción de libros con formato, columnas
// ajustadas, encabezados con color, congelado y varias hojas
// ============================================================
var XL_ACCENT='EF7D5C', XL_ACCENT2='D8603F', XL_BG2='FBF6F0', XL_DARK='2C2622', XL_BORDER='E6D6C4';
function xlAvailable(){ return typeof ExcelJS!=='undefined'; }
function xlRequireOrWarn(){
  if(!xlAvailable()){ showToast('⚠️ El motor de Excel no cargó todavía (necesita internet). Espera un momento e inténtalo de nuevo.'); return false; }
  return true;
}
function newWorkbook(){
  var wb=new ExcelJS.Workbook();
  wb.creator=(S.biz&&S.biz.name)||'Creamy Teo App';
  wb.created=new Date();
  wb.lastModifiedBy=(S.biz&&S.biz.name)||'Creamy Teo App';
  return wb;
}
// Escribe un bloque de título (nombre del negocio + subtítulo + fecha de generación)
// y devuelve el número de fila donde debe ir el encabezado de la tabla.
function xlTitleBlock(ws,title,subtitle,numCols){
  ws.mergeCells(1,1,1,Math.max(numCols,4));
  var c1=ws.getCell(1,1);
  c1.value=(S.biz&&S.biz.name?S.biz.name+' — ':'')+title;
  c1.font={bold:true,size:14,color:{argb:'FF'+XL_ACCENT2}};
  ws.getRow(1).height=22;
  ws.mergeCells(2,1,2,Math.max(numCols,4));
  var c2=ws.getCell(2,1);
  var when=new Date();
  var whenStr=when.toLocaleDateString('es-CO')+' '+when.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
  c2.value=(subtitle?subtitle+'  ·  ':'')+'Generado: '+whenStr;
  c2.font={italic:true,size:10,color:{argb:'FF6D6259'}};
  return 4; // fila 3 queda en blanco como separador, la tabla empieza en la 4
}
function xlStyleHeaderRow(ws,rowNumber,headers){
  var row=ws.getRow(rowNumber);
  headers.forEach(function(h,i){
    var cell=row.getCell(i+1);
    cell.value=h;
    cell.font={bold:true,color:{argb:'FFFFFFFF'},size:11};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL_ACCENT}};
    cell.alignment={vertical:'middle',horizontal:'left',wrapText:true};
    cell.border={bottom:{style:'thin',color:{argb:'FF'+XL_ACCENT2}}};
  });
  row.height=20;
  ws.views=[{state:'frozen',ySplit:rowNumber}];
}
function xlBorderCell(cell){
  cell.border={bottom:{style:'hair',color:{argb:'FF'+XL_BORDER}}};
}
function xlAutoWidth(ws,mins){
  var maxByCol={};
  ws.eachRow({includeEmpty:false},function(row){
    row.eachCell({includeEmpty:false},function(cell,colNumber){
      var len=(cell.value===null||cell.value===undefined)?0:String(cell.value).length;
      if(!maxByCol[colNumber]||len>maxByCol[colNumber]) maxByCol[colNumber]=len;
    });
  });
  var maxCol=0;
  Object.keys(maxByCol).forEach(function(k){ if(+k>maxCol) maxCol=+k; });
  for(var c=1;c<=maxCol;c++){
    var min=(mins&&mins[c-1])||10;
    var w=Math.max(maxByCol[c]||0,min);
    ws.getColumn(c).width=Math.min(w+3,42);
  }
}
// Escribe filas de datos a partir de rowStart, usando specs=[{key,fmt}] alineado con headers.
// data = array de objetos plano {key:valor}. fmt: 'currency' | 'pct' | 'int' | null(texto)
function xlWriteRows(ws,rowStart,data,keys,fmts){
  data.forEach(function(obj,i){
    var row=ws.getRow(rowStart+i);
    keys.forEach(function(k,ci){
      var cell=row.getCell(ci+1);
      var v=obj[k];
      cell.value=(v===undefined||v===null)?'':v;
      var f=fmts?fmts[ci]:null;
      if(f==='currency') cell.numFmt='$#,##0';
      else if(f==='pct') cell.numFmt='0.0%';
      else if(f==='int') cell.numFmt='#,##0';
      xlBorderCell(cell);
      if(i%2===1){ cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF'+XL_BG2}}; }
    });
  });
}
function xlColorStateCell(ws,rowNumber,colIndex,state){
  var cell=ws.getRow(rowNumber).getCell(colIndex);
  var colors={'Sin stock':'FFE0544A','Bajo':'FFD99A2B','OK':'FF3F9142'};
  cell.font={bold:true,color:{argb:colors[state]||'FF2C2622'}};
}
function xlBuildSheet(wb,sheetName,title,subtitle,headers,keys,fmts,data,stateColKey){
  var ws=wb.addWorksheet(sheetName.substring(0,31));
  var headerRow=xlTitleBlock(ws,title,subtitle,headers.length);
  xlStyleHeaderRow(ws,headerRow,headers);
  xlWriteRows(ws,headerRow+1,data,keys,fmts);
  if(stateColKey){
    var stateIdx=keys.indexOf(stateColKey)+1;
    data.forEach(function(obj,i){ xlColorStateCell(ws,headerRow+1+i,stateIdx,obj[stateColKey]); });
  }
  xlAutoWidth(ws,headers.map(function(h){return h.length;}));
  return ws;
}
function xlDownload(wb,filename){
  // Organiza los archivos exportados agregando fecha y hora antes de la extensión
  // (p. ej. "insumos.xlsx" -> "insumos_2026-08-14_1432.xlsx"), así ninguna exportación
  // sobrescribe a otra, ni siquiera si las haces el mismo día.
  var stamp=todayStr()+'_'+pad2(new Date().getHours())+pad2(new Date().getMinutes());
  var dated = /\.xlsx$/i.test(filename) ? filename.replace(/\.xlsx$/i,'_'+stamp+'.xlsx') : filename+'_'+stamp;
  wb.xlsx.writeBuffer().then(function(buf){
    triggerDownloadBinary(dated,buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
    showToast('📥 Descargando '+dated);
  }).catch(function(e){
    console.error(e);
    showToast('⚠️ Ocurrió un error generando el Excel.');
  });
}

    return {nombre:i.name,categoria:i.category||'',precio_compra:round2(i.buyPrice),cantidad_compra:i.buyQty,
      unidad_compra:i.buyUnit,unidad_base:i.baseUnit,proveedor:sup?sup.name:'',stock:round2(i.stock),
      stock_minimo:round2(i.minStock),costo_por_unidad_base:round2(getCostPerBase(i))};

}
function dataFichas(){
  var rows=[];
  S.recipes.forEach(function(r){
    r.ingredients.forEach(function(ri){
      var ing=ri.ref==='ing'?getIngById(ri.id):null;
      rows.push({ficha:r.name,emoji:r.emoji,precio_base:round2(r.basePrice),insumo:ing?ing.name:'(sub-receta)',
        cantidad:ri.qty,unidad:ri.unit,merma_pct:ri.wastePct||0});
    });
  });

function dataCompras(){
  return S.purchases.map(function(p){
    var ing=getIngById(p.ingId);var sup=S.suppliers.find(function(s){return s.id===p.supplierId});
    return {fecha:p.date,insumo:ing?ing.name:'?',cantidad:p.qty,unidad:p.unit,total:round2(p.total),
      costo_por_unidad:round2(p.newCostPerBase||0),proveedor:sup?sup.name:'?'};
  });
}
function dataVentas(){
  var rows=[];
  S.sales.forEach(function(s){
    s.items.forEach(function(i){
      rows.push({fecha:s.date,producto:i.name,cantidad:i.qty,precio:round2(i.price),costo:round2(i.cost),
        metodo:s.method,cajero:s.cashier});
    });
  });
  return rows;
}
function dataProveedores(){
  return S.suppliers.map(function(s){
    return {nombre:s.name,contacto:s.contact,ciudad:s.city,dias_entrega:s.deliveryDays,pedido_minimo:round2(s.minOrder),calidad:s.quality};
  });
}
function dataDesglose(){
  return S.recipes.map(function(r){
    var mp=getRecipeCostPerPortion(r);
    var emp=getRecipePackagingCostAll(r);
    var fix=getRecipeFixedAssigned(r);
    var var2=(r.varCosts||[]).reduce(function(a,v){return a+v.value},0);
    var tax2=r.taxId?S.taxes.find(function(t){return t.id===r.taxId}):null;
    var taxA=tax2?(mp+emp+fix+var2)*tax2.pct/100:0;
    var total=mp+emp+fix+var2+taxA;
    var weight=getRecipeTotalWeight(r);
    var perGram=weight>0?total/weight:0;
    return {ficha:r.name,materia_prima:round2(mp),empaques:round2(emp),costos_fijos:round2(fix),
      costos_variables:round2(var2),impuestos:round2(taxA),total:round2(total),gramaje:round2(weight),costo_por_gramo:round2(perGram)};
  });
}
function dataAuditoria(){
  var goal=(S.biz&&S.biz.marginGoal)||0;
  return S.recipes.map(function(r){
    var mp=getRecipeCostPerPortion(r);
    var emp=getRecipePackagingCostAll(r);
    var fix=getRecipeFixedAssigned(r);
    var var2=(r.varCosts||[]).reduce(function(a,v){return a+v.value},0);
    var tax2=r.taxId?S.taxes.find(function(t){return t.id===r.taxId}):null;
    var taxA=tax2?(mp+emp+fix+var2)*tax2.pct/100:0;
    var totalCost=mp+emp+fix+var2+taxA;
    var price=r.basePrice||0;
    var marginPct=price>0?(price-totalCost)/price:0;
    return {ficha:r.name,precio_venta:round2(price),costo_total:round2(totalCost),
      margen_actual:marginPct,margen_objetivo:goal/100,
      diferencia_pp:round2((marginPct*100)-goal),
      estado:(marginPct*100)>=goal?'OK':'Revisar'};
  });
}
function dataPL(){
  var t=getMonthTotals();
  return [
    {concepto:'Ingresos',valor:round2(t.revenue)},
    {concepto:'Costo de ventas',valor:round2(t.cost)},
    {concepto:'Utilidad bruta',valor:round2(t.gross)},
    {concepto:'Costos fijos',valor:round2(t.fixed)},
    {concepto:'Utilidad neta',valor:round2(t.net)}
  ];
}

// Normaliza texto de encabezado para comparar sin importar tildes, mayúsculas o puntuación
// (así "Precio de compra" y "Precio compra" se reconocen como el mismo encabezado)
function xlNormHeader(s){
  return String(s===null||s===undefined?'':s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ').trim();
}

  inventory:{nombre:['insumo'],stock_minimo:['stock min']},
  recipes:{precio_base:['precio'],merma_pct:['merma']},
  sales:{ficha:['producto'],precio_unitario:['precio'],metodo_pago:['metodo pago']},
  purchases:{total_pagado:['total']}

function xlBuildTemplateSheets(wb,spec){

  var hRow=xlTitleBlock(ws,'Plantilla — '+spec.label,'Completa una fila por registro y elimina la fila de ejemplo antes de importar',spec.headers.length);
  xlStyleHeaderRow(ws,hRow,spec.labels);
  var exRow=ws.getRow(hRow+1);
  spec.example.forEach(function(v,i){
    var cell=exRow.getCell(i+1);
    cell.value=v;
    cell.font={italic:true,color:{argb:'FFA39A8F'}};
    cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFDF3E0'}};

  ws.getCell(hRow+1,spec.headers.length+1).value='← fila de EJEMPLO, bórrala antes de importar';
  ws.getCell(hRow+1,spec.headers.length+1).font={italic:true,size:9,color:{argb:'FFD99A2B'}};
  xlAutoWidth(ws,spec.labels.map(function(h){return h.length;}));

  var wsI=wb.addWorksheet(('Instrucciones '+spec.sheet).substring(0,31));
  var hRow2=xlTitleBlock(wsI,'Instrucciones — '+spec.label,'Qué debe llevar cada columna de la hoja "'+spec.sheet+'"',3);
  xlStyleHeaderRow(wsI,hRow2,['Columna','Nombre visible','Descripción']);

  xlWriteRows(wsI,hRow2+1,rows,['col','label','desc'],[null,null,null]);
  xlAutoWidth(wsI,[16,20,60]);

// Busca en una hoja la fila de encabezados que corresponde a un tipo de plantilla dado.
// Reutilizable tanto para detectar automáticamente el tipo de archivo como para el import en sí.
function xlFindHeaderRow(ws,type){
  var spec=TEMPLATE_SPECS[type];
  if(!spec) return null;
  var aliasMap=IMPORT_HEADER_ALIASES[type]||{};
  var acceptSets=spec.headers.map(function(key,i){
    var set=[xlNormHeader(spec.labels[i])];
    (aliasMap[key]||[]).forEach(function(a){set.push(xlNormHeader(a));});
    return set;
  });
  var headerRowNum=null, colForKey=null;
  ws.eachRow(function(row,rowNum){
    if(headerRowNum) return;
    var normVals=row.values.slice(1).map(function(v){return xlNormHeader(v);});
    var colMap={}, matched=0;
    spec.headers.forEach(function(key,i){
      var idx=-1;
      for(var j=0;j<normVals.length;j++){ if(acceptSets[i].indexOf(normVals[j])>-1){ idx=j; break; } }
      if(idx>-1){ colMap[key]=idx; matched++; }
    });
    if(matched===spec.headers.length){ headerRowNum=rowNum; colForKey=colMap; }
  });
  return headerRowNum ? {headerRowNum:headerRowNum,colForKey:colForKey} : null;
}
// Detecta el tipo de importación mirando el CONTENIDO del archivo (nombre de hoja y encabezados),
// nunca el nombre del archivo — así el usuario puede guardar/renombrar sus archivos como quiera.
function xlDetectImportType(wb){
  var order=['ingredients','inventory','recipes','sales','purchases'];
  for(var i=0;i<order.length;i++){
    var type=order[i], spec=TEMPLATE_SPECS[type];
    var ws=wb.getWorksheet(spec.sheet);
    if(ws && xlFindHeaderRow(ws,type)) return type;
  }
  for(var i=0;i<order.length;i++){
    var type=order[i];
    for(var w=0;w<wb.worksheets.length;w++){
      var ws2=wb.worksheets[w];
      if(/instrucciones/i.test(ws2.name)) continue;
      if(xlFindHeaderRow(ws2,type)) return type;
    }
  }
  return null;
}
function onImpFileSelected(){
  var file=document.getElementById('imp-file').files[0];
  var note=document.getElementById('imp-detect-note');
  if(note) note.textContent='';
  if(!file || !/\.xlsx$/i.test(file.name) || !xlAvailable()) return;
  var reader=new FileReader();
  reader.onload=function(e){
    var wb=new ExcelJS.Workbook();
    wb.xlsx.load(e.target.result).then(function(){
      var detected=xlDetectImportType(wb);
      if(detected){
        document.getElementById('imp-type').value=detected;
        onImpTypeChange();
        if(note) note.textContent='📄 Tipo detectado automáticamente: '+TEMPLATE_SPECS[detected].label;
      } else if(note){
        note.textContent='⚠️ No se pudo detectar el tipo automáticamente. Selecciónalo manualmente arriba.';
      }
    }).catch(function(){});
  };
  reader.readAsArrayBuffer(file);
}
function importFile(){
  var file=document.getElementById('imp-file').files[0];
  var type=document.getElementById('imp-type').value;
  if(!file){showToast('Selecciona un archivo');return;}
  var isXlsx=/\.xlsx$/i.test(file.name);
  if(isXlsx){
    if(!xlRequireOrWarn()) return;
    var reader2=new FileReader();
    reader2.onload=function(e){
      var wb=new ExcelJS.Workbook();
      wb.xlsx.load(e.target.result).then(function(){
        var spec=TEMPLATE_SPECS[type];
        var ws=wb.getWorksheet(spec?spec.sheet:undefined) || wb.worksheets.find(function(w){return !/instrucciones/i.test(w.name);}) || wb.worksheets[0];
        var found = spec ? xlFindHeaderRow(ws,type) : null;
        var headerRowNum = found ? found.headerRowNum : null;
        var colForKey = found ? found.colForKey : null;
        if(!headerRowNum){ document.getElementById('imp-result').textContent='No se encontró la fila de encabezados esperada en el archivo. Verifica que sea la plantilla de "'+(spec?spec.label:type)+'" (o el reporte exportado de esa misma sección) y que no le hayan cambiado los nombres de columna.'; return; }
        var objs=[];
        for(var r=headerRowNum+1;r<=ws.rowCount;r++){
          var row=ws.getRow(r);
          var vals=row.values.slice(1);
          if(vals.every(function(v){return v===null||v===undefined||v==='';})) continue;
          var obj={};
          spec.headers.forEach(function(key){
            var idx=colForKey[key];
            obj[key]=(idx===undefined||vals[idx]===null||vals[idx]===undefined)?'':vals[idx];
          });
          objs.push(obj);
        }
        // Descarta la fila si coincide exactamente con la fila de ejemplo de la plantilla
        if(spec){
          objs=objs.filter(function(obj){
            return !spec.headers.every(function(h,i){return String(obj[h])===String(spec.example[i]);});
          });
        }
        confirmAndImport(type,objs);
      }).catch(function(err){
        console.error(err);
        document.getElementById('imp-result').textContent='No se pudo leer el archivo .xlsx.';
      });
    };
    reader2.readAsArrayBuffer(file);
    return;
  }
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    var lines=text.split('\n').filter(function(l){return l.trim()});
    if(lines.length<2){document.getElementById('imp-result').textContent='Archivo vacío o sin datos';return;}
    var headers=lines[0].split(',').map(function(h){return h.trim()});
    var objs=lines.slice(1).map(function(line){
      var vals=line.split(',').map(function(v){return v.trim()});
      var obj={};headers.forEach(function(h,i){obj[h]=vals[i]||'';});
      return obj;
    });
    confirmAndImport(type,objs);
  };
  reader.readAsText(file);
}
function processImportRows(type,objs,opts){
  opts=opts||{};
  var count=0;var notFound=[];
  objs.forEach(function(obj){
    if(type==='inventory'){
      var ing=S.ingredients.find(function(i){return i.name===obj.nombre;});
      if(ing){ing.stock=parseFloat(obj.stock)||ing.stock;ing.minStock=parseFloat(obj.stock_minimo)||ing.minStock;count++;}
      else notFound.push(obj.nombre);
    } else if(type==='ingredients'){
      var existing=S.ingredients.find(function(i){return i.name===obj.nombre;});
      if(existing){Object.assign(existing,{category:obj.categoria||existing.category,buyPrice:parseFloat(obj.precio)||existing.buyPrice,buyQty:parseFloat(obj.cantidad)||existing.buyQty,buyUnit:obj.unidad||existing.buyUnit,stock:parseFloat(obj.stock)||existing.stock,minStock:parseFloat(obj.stock_minimo)||existing.minStock});count++;}
      else{S.ingredients.push({id:uid(),name:obj.nombre,category:obj.categoria,buyPrice:parseFloat(obj.precio)||0,buyQty:parseFloat(obj.cantidad)||1,buyUnit:obj.unidad||'kg',baseUnit:'g',stock:parseFloat(obj.stock)||0,minStock:parseFloat(obj.stock_minimo)||0,supplier:1});count++;}
    } else if(type==='recipes'){
      if(!obj.ficha||!obj.insumo){notFound.push(obj.ficha||'(sin nombre)');return;}
      var ing2=S.ingredients.find(function(i){return i.name===obj.insumo;});
      if(!ing2){notFound.push(obj.insumo+' (insumo no existe)');return;}
      var rec=S.recipes.find(function(x){return x.name===obj.ficha;});
      if(!rec){
        rec={id:uid(),name:obj.ficha,emoji:obj.emoji||'🍽️',isSubrecipe:false,ingredients:[],yield:1,
          basePrice:parseFloat(obj.precio_base)||0,category:null,folderId:null,sizeLabel:'',
          toppingsIncluded:0,saucesExtraIncluded:0,toppingExtraPriceOverride:null,sauceExtraPriceOverride:null,
          includeFixed:true,includeEquip:false,disposables:[],deliveryPackaging:[],packaging:[],posDescription:'',
          active:true,varCosts:[],fixedCostPct:8,fixedFactor:1};
        S.recipes.push(rec);
      }
      rec.ingredients.push({ref:'ing',id:ing2.id,qty:parseFloat(obj.cantidad)||0,unit:obj.unidad||ing2.baseUnit,wastePct:parseFloat(obj.merma_pct)||0});
      count++;
    } else if(type==='sales'){
      if(!obj.ficha){notFound.push('(fila sin ficha)');return;}
      var rec2=S.recipes.find(function(x){return x.name===obj.ficha;});
      var qty=parseFloat(obj.cantidad)||1;
      var price=parseFloat(obj.precio_unitario)||(rec2?rec2.basePrice:0)||0;
      var cost=rec2?getRecipeCostPerPortion(rec2):0;
      S.sales.push({id:uid(),date:obj.fecha||nowStamp(),items:[{name:obj.ficha,size:'',qty:qty,price:price,cost:cost}],
        total:qty*price,cost:qty*cost,method:obj.metodo_pago||'Efectivo',cashier:'Importado'});
      if(opts.deductStock && rec2) deductRecipeStockUsage(rec2,qty);
      if(!rec2) notFound.push(obj.ficha+' (ficha no encontrada, se registró la venta sin costo ni descuento de inventario)');
      count++;
    } else if(type==='purchases'){
      if(!obj.insumo){notFound.push('(fila sin insumo)');return;}
      var ing3=S.ingredients.find(function(i){return i.name===obj.insumo;});
      if(!ing3){notFound.push(obj.insumo+' (insumo no existe)');return;}
      var qty3=parseFloat(obj.cantidad)||0;
      var unit3=obj.unidad||ing3.baseUnit;
      var total3=parseFloat(obj.total_pagado)||0;
      var factor=getConversionFactor(unit3,ing3.baseUnit);
      ing3.stock+=qty3*factor;
      var newCostPerBase=total3>0&&qty3>0?total3/(qty3*factor):getCostPerBase(ing3);
      if(total3>0){ing3.buyPrice=total3;ing3.buyQty=qty3;ing3.buyUnit=unit3;}
      S.purchases.push({id:uid(),date:obj.fecha||nowStamp(),ingId:ing3.id,supplierId:ing3.supplier,qty:qty3,unit:unit3,total:total3,newCostPerBase:newCostPerBase});
      count++;
    }
  });
  var res='✅ '+count+' registros importados';
  if(notFound.length>0) res+=' | ⚠️ Con problemas: '+notFound.join(', ');
  saveData();
  recalcAll();
  var elRes=document.getElementById('imp-result');
  if(elRes) elRes.textContent=res;
}

function escAttr(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}
function escJs(s){
  return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
}

// ---------- Migración defensiva de datos guardados ----------
// Si el localStorage viene de una versión anterior con formas de
// datos distintas (categorías como texto plano, sizes sin grupo,
// etc.), esto normaliza todo para que la interfaz no se rompa.
function migrateStateV53(){
  S.extraCategories = S.extraCategories || {toppings:[],sauces:[],packagings:[]};
  ['toppings','sauces','packagings'].forEach(function(type){
    var arr = S.extraCategories[type];
    if(!Array.isArray(arr)){ S.extraCategories[type]=[]; return; }
    S.extraCategories[type] = arr.map(function(c){
      if(c && typeof c==='object' && c.id!=null && c.name!=null) return c;
      // formato viejo (string suelto) -> conviértelo a objeto
      return {id:uid(), name:String(c)};
    });
  });

  // Grupos de tamaño (nuevo): por ejemplo "Vasos/Bebidas", "Obleas", "Solteritas"
  if(!Array.isArray(S.sizeGroups) || S.sizeGroups.length===0){
    S.sizeGroups = [
      {id:1,name:'Vasos / Bebidas y postres en vaso'},
      {id:2,name:'Obleas'},
      {id:3,name:'Solteritas'}
    ];
  }
  (S.sizes||[]).forEach(function(sz){
    if(sz.groupId==null) sz.groupId = S.sizeGroups[0].id; // por defecto, el primer grupo
  });
  // Cada ficha necesita saber a qué grupo de tamaños pertenece
  (S.recipes||[]).forEach(function(r){
    if(r.sizeGroupId==null) r.sizeGroupId = S.sizeGroups[0].id;
    if(!Array.isArray(r.disposables)) r.disposables = [];        // desechables obligatorios (insumos)
    if(!Array.isArray(r.deliveryPackaging)) r.deliveryPackaging = []; // empaque opcional para domicilio (insumos)
    if(!Array.isArray(r.packaging)) r.packaging = [];             // empaques de venta (vasos, tapas, etc)
    // Mapas de gramaje/receta específicos por tamaño: {sizeId:{itemId:qty}}. Vacío = ese tamaño
    // usa la cantidad general de la línea. Así un mismo producto puede tener distinta receta por tamaño.
    if(!r.ingredientsBySize) r.ingredientsBySize = {};
    if(!r.disposablesBySize) r.disposablesBySize = {};
    if(!r.deliveryPackagingBySize) r.deliveryPackagingBySize = {};
    if(!r.packagingBySize) r.packagingBySize = {};
  });

  // (Ya no se usan banderas manuales: desechable/empaque de domicilio/topping se detectan
  // automáticamente por la categoría del insumo — ver ingIsDisposable/ingIsDeliveryPackaging/ingIsTopping)

  // Toppings premium: nunca cuentan como "gratis" y solo se muestran en el POS si el
  // producto tiene toppings gratis habilitados (toppingsIncluded > 0).
  (S.toppings||[]).forEach(function(t){ if(t.premium==null) t.premium=false; });

  // Carpetas de producto: agrupan variaciones de un mismo producto (ej. "Fresas con crema" 8oz/12oz/sin azúcar)
  if(!Array.isArray(S.productFolders)) S.productFolders=[];
  (S.recipes||[]).forEach(function(r){
    if(r.folderId===undefined) r.folderId=null;
  });
  window._ingUI = window._ingUI || {q:'', sortField:'name', sortDir:'asc'};

  // ---- V54: Módulo de Fichas Técnicas rediseñado — Productos / Presentaciones / Subrecetas ----
  // Cada producto (carpeta) ahora tiene categoría y estado propio; cada ficha es una presentación
  // 100% independiente (su propia receta/gramaje/precio), no una variación calculada con multiplicador.
  S.productFolders.forEach(function(f){
    if(f.active==null) f.active=true;
    if(f.categoryId===undefined) f.categoryId=null;
  });
  (S.recipes||[]).forEach(function(r){
    if(r.sizeLabel==null) r.sizeLabel = r.name || 'Única';       // nombre de la presentación (ej. "Pequeña")
    if(r.posDescription==null) r.posDescription = '';             // texto libre que ve el cajero/cliente en el POS
    if(r.isSubrecipe==null) r.isSubrecipe = false;                 // true = subreceta reutilizable, no se vende directo
    if(r.toppingExtraPriceOverride===undefined) r.toppingExtraPriceOverride = null; // null = usa el precio global de cada topping
    if(r.sauceExtraPriceOverride===undefined) r.sauceExtraPriceOverride = null;
    if(r.active==null) r.active = true;
  });
}

// ============================================================
// FICHAS TÉCNICAS — costo con desechables + empaque de domicilio
// ============================================================
function getRecipeDisposablesCost(recipe, sizeId){
  return (recipe.disposables||[]).reduce(function(a,d){
    var ing=getIngById(d.ingId); if(!ing) return a;
    var qty=getSizeOverrideQty(recipe.disposablesBySize, sizeId, d.ingId, d.qty);
    return a + getCostPerBase(ing)*qty;
  },0);
}
function getRecipeDeliveryPackagingCost(recipe, sizeId){
  return (recipe.deliveryPackaging||[]).reduce(function(a,d){
    var ing=getIngById(d.ingId); if(!ing) return a;
    var qty=getSizeOverrideQty(recipe.deliveryPackagingBySize, sizeId, d.ingId, d.qty);
    return a + getCostPerBase(ing)*qty;
  },0);
}

// Costo total real por tamaño: suma materia prima + desechables (siempre) + empaques de venta
// (si están seleccionados) + empaque de domicilio (solo si isDelivery=true, p.ej. desde el POS)
// + toppings/salsas incluidos gratis + costos fijos/variables/impuestos. Cada parte respeta el
// gramaje/receta específico del tamaño elegido cuando existe (ver getSizeOverrideQty).
function getRecipeFullCost(recipe, sizeId, isDelivery){
  if(sizeId===undefined){
    var defSize=S.sizes.find(function(s){return s.default;});
    sizeId=defSize?defSize.id:null;
  }
  var mp=getRecipeCostPerPortion(recipe, sizeId);
  var emp=getRecipePackagingCostAll(recipe, sizeId);
  var disp=getRecipeDisposablesCost(recipe, sizeId);
  var deliv=isDelivery?getRecipeDeliveryPackagingCost(recipe, sizeId):0;
  var fixedAssigned=(recipe.includeFixed===false)?0:getRecipeFixedAssigned(recipe);
  var equipAssigned=(recipe.includeEquip)?getEquipmentCostPerUnit()*(recipe.fixedFactor!=null?recipe.fixedFactor:1):0;
  var extrasIncluded=getRecipeIncludedExtrasCost(recipe, sizeId);
  var varCost=(recipe.varCosts||[]).reduce(function(a,v){return a+v.value},0);
  var tax=recipe.taxId?S.taxes.find(function(t){return t.id===recipe.taxId}):null;
  var subtotal=mp+emp+disp+deliv+fixedAssigned+equipAssigned+extrasIncluded+varCost;
  var taxAmt=tax?subtotal*tax.pct/100:0;
  return subtotal+taxAmt;
}
// Precio de venta de una ficha para un tamaño específico (precio base × multiplicador del tamaño)
function getRecipeSizePrice(recipe, sizeId){
  if(!sizeId) return recipe.basePrice||0;
  var sz=S.sizes.find(function(s){return s.id===sizeId;});
  return (recipe.basePrice||0) * (sz&&sz.multiplier!=null?sz.multiplier:1);
}
// Costo de materia prima para vender un tamaño específico. Si ese tamaño ya tiene un gramaje/receta
// propio configurado en la ficha, se usa el costo exacto de esa receta. Si no, se usa el estimado
// clásico (costo general × multiplicador de precio del tamaño) como aproximación razonable.
function recipeHasSizeIngredientOverride(recipe, sizeId){
  return !!(sizeId && recipe.ingredientsBySize && recipe.ingredientsBySize[sizeId] && Object.keys(recipe.ingredientsBySize[sizeId]).length>0);
}
function getRecipeCostPerPortionForSale(recipe, sizeId, mult){
  if(recipeHasSizeIngredientOverride(recipe, sizeId)) return getRecipeCostPerPortion(recipe, sizeId);
  return getRecipeCostPerPortion(recipe) * (mult!=null?mult:1);
}

// Delegación única de eventos para todo el módulo de Extras.
// Evita depender de onclick con texto interpolado (frágil si el
// nombre tiene comillas) y hace que TODOS los controles respondan.
function bindExtrasDelegation(container){
  if(container._extrasBound) return;
  container._extrasBound = true;

  container.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el || !container.contains(el)) return;
    var action = el.getAttribute('data-action');
    var kind = el.getAttribute('data-kind');
    var id = el.getAttribute('data-id') ? parseInt(el.getAttribute('data-id')) : null;

    if(action==='add-cat'){
      var type=el.getAttribute('data-cattype');
      var input=container.querySelector('.ext-newcat-input[data-cattype="'+type+'"]');
      var name=input?input.value.trim():'';
      if(!name){ input && input.focus(); return; }
      S.extraCategories[type]=S.extraCategories[type]||[];
      S.extraCategories[type].push({id:uid(),name:name});
      recalcAll();
    } else if(action==='delete-cat'){
      var type2=el.getAttribute('data-cattype');
      var cid=parseInt(el.getAttribute('data-cat-id'));
      askConfirm('¿Eliminar esta categoría? Los elementos que la usan quedarán "Sin categoría".',function(){
        S.extraCategories[type2]=(S.extraCategories[type2]||[]).filter(function(c){return c.id!==cid;});
        var coll = type2==='toppings'?S.toppings:(type2==='sauces'?S.sauces:S.packagings);
        coll.forEach(function(item){if(item.category===cid) item.category=null;});
        recalcAll();
      },{title:'Eliminar categoría'});
    } else if(action==='add-item'){
      if(kind==='topping'){ openToppingPickerModal(); }
      else { addExtraItem(kind); }
    } else if(action==='delete-item'){
      askConfirm('¿Eliminar este elemento?',function(){
        var coll2 = kind==='topping'?S.toppings:(kind==='sauce'?S.sauces:S.packagings);
        var idx=coll2.findIndex(function(x){return x.id===id;});
        if(idx>-1) coll2.splice(idx,1);
        recalcAll();
      },{title:'Eliminar elemento'});
    } else if(action==='usage'){
      openExtraUsageModal(kind, id);
    } else if(action==='add-sizegroup'){
      S.sizeGroups.push({id:uid(),name:'Nuevo grupo'});
      recalcAll();
    } else if(action==='delete-sizegroup'){
      askConfirm('¿Eliminar este grupo de tamaños? Los tamaños dentro de él también se eliminarán.',function(){
        S.sizes=S.sizes.filter(function(s){return s.groupId!==id;});
        S.sizeGroups=S.sizeGroups.filter(function(g){return g.id!==id;});
        if(S.sizeGroups.length===0) S.sizeGroups.push({id:uid(),name:'General'});
        (S.recipes||[]).forEach(function(r){ if(r.sizeGroupId===id) r.sizeGroupId=S.sizeGroups[0].id; });
        recalcAll();
      },{title:'Eliminar grupo de tamaños'});
    } else if(action==='add-size'){
      var gid=parseInt(el.getAttribute('data-group-id'));
      S.sizes.push({id:uid(),name:'Nuevo',suffix:'',multiplier:1,default:false,active:true,groupId:gid});
      recalcAll();
    } else if(action==='delete-size'){
      S.sizes=S.sizes.filter(function(s){return s.id!==id;});
      recalcAll();
    }
  });

  container.addEventListener('change', function(e){
    var el = e.target.closest('[data-action]');
    if(!el || !container.contains(el)) return;
    var action = el.getAttribute('data-action');
    var kind = el.getAttribute('data-kind');
    var id = el.getAttribute('data-id') ? parseInt(el.getAttribute('data-id')) : null;

    function collFor(k){ return k==='topping'?S.toppings:(k==='sauce'?S.sauces:S.packagings); }

    if(action==='field' || action==='field-num' || action==='field-int' || action==='field-bool'){
      var coll=collFor(kind);
      var item=coll.find(function(x){return x.id===id;});
      if(!item) return;
      var field=el.getAttribute('data-field');
      var val;
      if(action==='field') val=el.value;
      else if(action==='field-num') val=parseFloat(el.value)||0;
      else if(action==='field-int') val=el.value?parseInt(el.value):null;
      else if(action==='field-bool') val=el.checked;
      item[field]=val;
      recalcAll();
    } else if(action==='rename-cat'){
      var type=el.getAttribute('data-cattype');
      var cid=parseInt(el.getAttribute('data-cat-id'));
      var cat=(S.extraCategories[type]||[]).find(function(c){return c.id===cid;});
      if(cat) cat.name=el.value;
      saveData();
    } else if(action==='rename-sizegroup'){
      var grp=S.sizeGroups.find(function(g){return g.id===id;});
      if(grp) grp.name=el.value;
      saveData();
    } else if(action==='size-field' || action==='size-field-num' || action==='size-field-bool'){
      var sz=S.sizes.find(function(x){return x.id===id;});
      if(!sz) return;
      var f=el.getAttribute('data-field');
      if(action==='size-field') sz[f]=el.value;
      else if(action==='size-field-num') sz[f]=parseFloat(el.value)||0;
      else if(action==='size-field-bool'){
        if(f==='default' && el.checked){
          S.sizes.filter(function(s){return s.groupId===sz.groupId;}).forEach(function(s){s.default=false;});
        }
        sz[f]=el.checked;
      }
      recalcAll();
    }
  });
}

// ============================================================
// FICHAS TÉCNICAS — ingredientes editables + desechables + empaque opcional
// ============================================================
// Tabla de items agregados (desechables o empaque de domicilio) dentro del modal de ficha,
// con el mismo patrón de "desplegable + agregar" que la sección de Ingredientes.
// Tabla genérica reutilizable para "insumos con bandera" (desechables, empaque domicilio)
// y para empaques de venta (S.packagings). prefix: 'disp' | 'deliv' | 'pkg'
function flagRefKey(prefix){ return prefix==='pkg' ? 'id' : 'ingId'; }
function flagArrFor(prefix){
  if(prefix==='disp') return window._tmpDisposables;
  if(prefix==='deliv') return window._tmpDeliveryPackaging;
  return window._tmpPackaging;
}
function flagItemLookup(prefix,refId){
  if(prefix==='pkg') return S.packagings.find(function(x){return x.id===refId;});
  return getIngById(refId);
}
function flagItemName(prefix,item){
  if(!item) return '(eliminado)';
  return prefix==='pkg' ? (item.emoji+' '+item.name) : item.name;
}
function flagItemUnit(prefix,item){ return prefix==='pkg' ? 'und' : (item?item.baseUnit:''); }
function flagItemCost(prefix,item,qty){
  if(!item) return 0;
  return prefix==='pkg' ? item.cost*(parseFloat(qty)||0) : getCostPerBase(item)*(parseFloat(qty)||0);
}
function renderFlagItemsTable(rows,prefix){
  if(!rows||rows.length===0){
    return '<p style="font-size:12px;color:var(--text3)">Todavía no has agregado ninguno. Elige uno abajo y dale "+ Agregar".</p>';
  }
  var refKey=flagRefKey(prefix);
  var total=0;
  var body=rows.map(function(row,idx){
    var item=flagItemLookup(prefix,row[refKey]);
    var name=flagItemName(prefix,item);
    var unit=flagItemUnit(prefix,item);
    var lineCost=flagItemCost(prefix,item,row.qty);
    total+=lineCost;
    return '<tr>'+
      '<td>'+escAttr(name)+'</td>'+
      '<td><input class="inline-edit" type="number" style="width:70px" value="'+row.qty+'" onchange="updateFlagItemQty(\''+prefix+'\','+idx+',this.value)"> '+escAttr(unit)+'</td>'+
      '<td style="color:var(--accent);font-weight:500">'+fmt(lineCost)+'</td>'+
      '<td><button type="button" class="btn btn-sm btn-danger" onclick="removeFlagItemRow(\''+prefix+'\','+idx+')">✕</button></td>'+
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>'+(prefix==='pkg'?'Empaque':'Insumo')+'</th><th>Cantidad por porción</th><th>Costo</th><th></th></tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="pl-row bold" style="margin-top:4px"><span>Subtotal</span><span>'+fmt(total)+'</span></div>';
}
function addFlagItemToModal(prefix){
  var sel=document.getElementById('rm-'+prefix+'-sel');
  var qtyEl=document.getElementById('rm-'+prefix+'-qty');
  if(!sel||!sel.value) return;
  var refId=parseInt(sel.value);
  var qty=parseFloat(qtyEl.value)||0;
  if(qty<=0){ showToast('Ingresa una cantidad mayor a 0'); return; }
  var arr=flagArrFor(prefix);
  var refKey=flagRefKey(prefix);
  var existing=arr.find(function(x){return x[refKey]===refId;});
  if(existing){ existing.qty=qty; } else { var row={qty:qty}; row[refKey]=refId; arr.push(row); }
  document.getElementById('rm-'+prefix+'-body').innerHTML=renderFlagItemsTable(arr,prefix);
  refreshFichaSummary();
}
function removeFlagItemRow(prefix,idx){
  var arr=flagArrFor(prefix);
  arr.splice(idx,1);
  document.getElementById('rm-'+prefix+'-body').innerHTML=renderFlagItemsTable(arr,prefix);
  refreshFichaSummary();
}
function updateFlagItemQty(prefix,idx,val){
  var arr=flagArrFor(prefix);
  if(arr[idx]) arr[idx].qty=parseFloat(val)||0;
  document.getElementById('rm-'+prefix+'-body').innerHTML=renderFlagItemsTable(arr,prefix);
  refreshFichaSummary();
}

// Al cambiar de producto (carpeta), la categoría de la presentación se hereda del producto —
// se oculta el selector manual para que todas las presentaciones de un mismo producto queden
// siempre en la misma categoría del menú.
function onFolderChangeInModal(){
  var folderVal=document.getElementById('rm-folder').value;
  var catWrap=document.getElementById('rm-cat-wrap');
  var inheritedMsg=document.getElementById('rm-cat-inherited');
  if(folderVal){
    var f=S.productFolders.find(function(x){return x.id===parseInt(folderVal);});
    if(catWrap) catWrap.style.display='none';
    if(inheritedMsg){ inheritedMsg.style.display='block'; inheritedMsg.textContent='Categoría heredada del producto "'+(f?f.name:'')+'". Se administra desde Productos.'; }
  } else {
    if(catWrap) catWrap.style.display='';
    if(inheritedMsg) inheritedMsg.style.display='none';
  }
}

// Purga entradas de gramaje de toppings/salsas que hayan quedado huérfanas si el usuario cancela
// la creación de una ficha nueva (el id se genera al abrir el modal, antes de guardar).
function cancelRecipeModal(id,isNew){
  if(isNew){
    [S.toppings,S.sauces].forEach(function(coll){
      coll.forEach(function(it){
        if(it.usage) it.usage=it.usage.filter(function(u){return u.recipeId!==id;});
      });
    });
  }
  closeModal();
}

function buildLiveRecipeSnapshot(id){
  var priceEl=document.getElementById('rm-price');
  var yieldEl=document.getElementById('rm-yield');
  var topsEl=document.getElementById('rm-tops');
  var sauEl=document.getElementById('rm-sauces-extra');
  var fixedEl=document.getElementById('rm-incfixed');
  var equipEl=document.getElementById('rm-incequip');
  var topPriceEl=document.getElementById('rm-top-extra-price');
  var sauPriceEl=document.getElementById('rm-sau-extra-price');
  var existing=getRecipeById(id)||{};
  return {
    id:id,
    basePrice:priceEl?(parseFloat(priceEl.value)||0):(existing.basePrice||0),
    yield:yieldEl?(parseFloat(yieldEl.value)||1):(existing.yield||1),
    ingredients:(window._tmpRIngredients||[]).filter(function(x){return x!==null;}),
    disposables:window._tmpDisposables||[],
    deliveryPackaging:window._tmpDeliveryPackaging||[],
    packaging:window._tmpPackaging||[],
    toppingsIncluded:topsEl?(parseInt(topsEl.value)||0):(existing.toppingsIncluded||0),
    saucesExtraIncluded:sauEl?(parseInt(sauEl.value)||0):(existing.saucesExtraIncluded||0),
    toppingExtraPriceOverride:topPriceEl?(topPriceEl.value!==''?parseFloat(topPriceEl.value):null):(existing.toppingExtraPriceOverride!=null?existing.toppingExtraPriceOverride:null),
    sauceExtraPriceOverride:sauPriceEl?(sauPriceEl.value!==''?parseFloat(sauPriceEl.value):null):(existing.sauceExtraPriceOverride!=null?existing.sauceExtraPriceOverride:null),
    includeFixed:fixedEl?fixedEl.checked:(existing.includeFixed!==false),
    includeEquip:equipEl?equipEl.checked:!!existing.includeEquip,
    fixedCostPct:existing.fixedCostPct||0,
    fixedFactor:existing.fixedFactor!=null?existing.fixedFactor:1,
    varCosts:existing.varCosts||[],
    taxId:existing.taxId||null
  };
}
function buildFichaSummaryHtml(id, isSub){
  var r=buildLiveRecipeSnapshot(id);
  if(isSub){
    var ingCost=(r.ingredients||[]).reduce(function(a,ri){return a+computeRiCost(ri);},0);
    var weight=getSubrecipeWeight(r);
    var perGram=weight>0?ingCost/weight:0;
    return '<div class="pl-row"><span>Costo total de ingredientes</span><span>'+fmt(ingCost)+'</span></div>'+
      '<div class="pl-row"><span>Peso total (según ingredientes)</span><span>'+num2(weight)+' g</span></div>'+
      '<div class="pl-row total"><span>Costo por gramo</span><span>'+fmt(perGram)+'/g</span></div>';
  }
  var mp=getRecipeCostPerPortion(r);
  var disp=getRecipeDisposablesCost(r);
  var pkg=getRecipePackagingCostAll(r);
  var ext=getRecipeIncludedExtrasCost(r,null);
  var full=getRecipeFullCost(r,null,false);
  var price=r.basePrice||0;
  var margin=price>0?((price-full)/price*100):0;
  var marginColor=margin<0?'var(--danger)':(margin<20?'var(--warning)':'var(--accent)');
  var weight=getRecipeTotalWeight(r);
  return '<div class="pl-row"><span>Ingredientes</span><span>'+fmt(mp)+'</span></div>'+
    '<div class="pl-row"><span>Desechables</span><span>'+fmt(disp)+'</span></div>'+
    '<div class="pl-row"><span>Empaques de venta</span><span>'+fmt(pkg)+'</span></div>'+
    '<div class="pl-row"><span>Toppings/salsas incluidos (aunque sean gratis para el cliente)</span><span>'+fmt(ext)+'</span></div>'+
    '<div class="pl-row"><span style="color:var(--text2)">Gramaje total</span><span>'+num2(weight)+' g/ml</span></div>'+
    '<div class="pl-row total"><span>Costo total de producción</span><span>'+fmt(full)+'</span></div>'+
    '<div class="pl-row"><span>Precio de venta</span><span>'+fmt(price)+'</span></div>'+
    '<div class="pl-row" style="font-weight:600"><span>Utilidad bruta / Margen</span><span style="color:'+marginColor+'">'+fmt(price-full)+' — '+margin.toFixed(1)+'%</span></div>';
}
function refreshFichaSummary(){
  var el=document.getElementById('rm-summary-wrap');

function saveRecipeModal(id){
  var ings=(window._tmpRIngredients||[]).filter(function(r){return r!==null});
  var isSub=window._tmpIsSubrecipe;
  var disposables=(window._tmpDisposables||[]).filter(function(d){return d.qty>0;});
  var deliveryPackaging=(window._tmpDeliveryPackaging||[]).filter(function(d){return d.qty>0;});
  var packaging=(window._tmpPackaging||[]).filter(function(p){return p.qty>0;});
  var yieldElSave=document.getElementById('rm-yield'); // no existe en modo subreceta: ya no se usa gramaje/rinde manual ahí
  var data={
    id:id,
    name:document.getElementById('rm-name').value,
    emoji:document.getElementById('rm-emoji').value||'🍓',
    isSubrecipe:isSub,
    ingredients:ings,
    yield:yieldElSave?(parseFloat(yieldElSave.value)||1):1
  };
  if(isSub){
    Object.assign(data,{
      photo:null,folderId:null,sizeLabel:'',category:null,basePrice:0,
      toppingsIncluded:0,saucesExtraIncluded:0,toppingExtraPriceOverride:null,sauceExtraPriceOverride:null,
      includeFixed:false,includeEquip:false,disposables:[],deliveryPackaging:[],packaging:[],posDescription:'',active:true
    });
  } else {
    var folderVal=document.getElementById('rm-folder').value;
    var folderId=folderVal?parseInt(folderVal):null;
    var folder=folderId?S.productFolders.find(function(f){return f.id===folderId;}):null;
    var catEl=document.getElementById('rm-cat');
    var topPriceVal=document.getElementById('rm-top-extra-price').value;
    var sauPriceVal=document.getElementById('rm-sau-extra-price').value;
    var marginVal=document.getElementById('rm-margin').value;
    Object.assign(data,{
      photo:window._tmpPhoto!==undefined?window._tmpPhoto:null,
      basePrice:parseFloat(document.getElementById('rm-price').value)||0,
      category: folder ? folder.categoryId : (catEl?parseInt(catEl.value):null),
      folderId:folderId,
      sizeLabel:document.getElementById('rm-sizelabel').value||'',
      toppingsIncluded:parseInt(document.getElementById('rm-tops').value)||0,
      saucesExtraIncluded:parseInt(document.getElementById('rm-sauces-extra').value)||0,
      toppingExtraPriceOverride:topPriceVal!==''?parseFloat(topPriceVal):null,
      sauceExtraPriceOverride:sauPriceVal!==''?parseFloat(sauPriceVal):null,
      marginGoal:marginVal!==''?parseFloat(marginVal):null,
      includeFixed:document.getElementById('rm-incfixed').checked,
      includeEquip:document.getElementById('rm-incequip').checked,
      disposables:disposables,
      deliveryPackaging:deliveryPackaging,
      packaging:packaging,
      posDescription:document.getElementById('rm-posdesc').value||'',
      active:true
    });
  }
  var rec=getRecipeById(id);
  if(rec){
    Object.assign(rec,data);
    if(!rec.varCosts) rec.varCosts=[];
    if(rec.fixedFactor==null) rec.fixedFactor=1;
    if(rec.fixedCostPct==null) rec.fixedCostPct=8;
  } else {
    data.varCosts=[];data.fixedCostPct=8;data.fixedFactor=1;
    S.recipes.push(data);
  }
  window._tmpPhoto=undefined;
  closeModal();recalcAll();
}

function ingSortArrow(field){
  if(window._ingUI.sortField!==field) return '';
  return window._ingUI.sortDir==='asc' ? ' ▲' : ' ▼';
}
function setIngSort(field){
  if(window._ingUI.sortField===field){
    window._ingUI.sortDir = window._ingUI.sortDir==='asc' ? 'desc' : 'asc';
  } else {
    window._ingUI.sortField = field;
    window._ingUI.sortDir = 'asc';
  }
  renderIngTableBody();
}
function getFilteredSortedIngredients(){
  var q=(window._ingUI.q||'').toLowerCase().trim();
  var list=S.ingredients.filter(function(ing){
    if(!q) return true;
    var sup=S.suppliers.find(function(s){return s.id===ing.supplier});
    var hay=(ing.name+' '+(ing.category||'')+' '+(sup?sup.name:'')).toLowerCase();
    return hay.indexOf(q)>-1;
  });
  var field=window._ingUI.sortField||'name';
  var dir=window._ingUI.sortDir==='desc'?-1:1;
  function valOf(ing){
    switch(field){
      case 'category': return (ing.category||'').toLowerCase();
      case 'cpb': return getCostPerBase(ing);
      case 'trend': return getIngTrend(ing);
      case 'supplier': var s=S.suppliers.find(function(x){return x.id===ing.supplier}); return s?s.name.toLowerCase():'';
      case 'isTopping': return ingIsTopping(ing)?1:0;
      case 'stock': return parseFloat(ing.stock)||0;
      case 'minStock': return parseFloat(ing.minStock)||0;
      case 'name': default: return (ing.name||'').toLowerCase();
    }
  }
  list.sort(function(a,b){
    var va=valOf(a), vb=valOf(b);
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
  return list;
}

  var linkedSau=S.sauces.filter(function(s){return s.ingredientId===ing.id;}).map(function(s){return '<span class="badge badge-amber" style="margin:1px">🫙 '+escAttr(s.name)+'</span>';}).join('');
  var usedAs=(linkedTop+linkedSau)||'<span style="font-size:11px;color:var(--text3)">—</span>';

  if(ingIsDisposable(ing)) tags.push('<span class="badge badge-green" style="margin:1px">♻️ Desechable</span>');

  var tagsHtml=tags.join('')||'<span style="font-size:11px;color:var(--text3)">—</span>';
  return '<tr>'+
    '<td><b style="font-weight:500">'+escAttr(ing.name)+'</b><br><span style="font-size:11px;color:var(--text3)">'+escAttr(ing.buyUnit)+' → '+escAttr(ing.baseUnit)+'</span></td>'+
    '<td>'+escAttr(ing.category)+'</td>'+
    '<td>'+fmt(cpb)+'/'+escAttr(ing.baseUnit)+'</td>'+
    '<td>'+trendBadge(getIngTrend(ing))+'</td>'+
    '<td>'+(sup?escAttr(sup.name):'—')+'</td>'+
    '<td>'+usedAs+'</td>'+
    '<td title="Se detecta automáticamente según la categoría del insumo">'+tagsHtml+'</td>'+
    '<td style="white-space:nowrap"><input class="inline-edit" style="width:90px" type="number" value="'+ing.stock+'" onchange="updateIngStock('+ing.id+',this.value)"> '+escAttr(ing.baseUnit)+'</td>'+
    '<td style="white-space:nowrap"><input class="inline-edit" style="width:90px" type="number" value="'+ing.minStock+'" onchange="updateIngMin('+ing.id+',this.value)"> '+escAttr(ing.baseUnit)+'</td>'+
    '<td style="white-space:nowrap"><button type="button" class="btn btn-sm" onclick="openIngModal('+ing.id+')">✏️</button> <button type="button" class="btn btn-sm btn-danger" onclick="deleteIng('+ing.id+')">🗑</button></td>'+
  '</tr>';
}
function renderIngTableBody(){
  var el=document.getElementById('ing-table-outer');
  if(!el) return;
  var list=getFilteredSortedIngredients();
  var thead='<tr>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'name\')">Nombre'+ingSortArrow('name')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'category\')">Categoría'+ingSortArrow('category')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'cpb\')">$/U. base'+ingSortArrow('cpb')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'trend\')">Tendencia'+ingSortArrow('trend')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'supplier\')">Proveedor'+ingSortArrow('supplier')+'</th>'+
    '<th>Usado como</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'isTopping\')">Etiquetas'+ingSortArrow('isTopping')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'stock\')">Stock'+ingSortArrow('stock')+'</th>'+
    '<th style="cursor:pointer;user-select:none" onclick="setIngSort(\'minStock\')">Mín'+ingSortArrow('minStock')+'</th>'+
    '<th>Acciones</th>'+
  '</tr>';
  var rows=list.map(ingRowHtml).join('') || '<tr><td colspan="10" style="text-align:center;color:var(--text3);padding:16px">Sin insumos que coincidan con la búsqueda.</td></tr>';
  el.innerHTML='<div class="table-wrap"><table><thead>'+thead+'</thead><tbody>'+rows+'</tbody></table></div>';
}
